<body>
<div id="bar">
  <span id="who"><b>Workbench</b><span id="src">no source</span></span>
  <span id="tools">
    <button id="open" type="button" title="or drop one anywhere on the page">Open .pfs</button>
    <input id="file" type="file" accept=".pfs,application/octet-stream">
    <input id="url" type="text" spellcheck="false" title="the screen socket">
    <button id="live" type="button">Connect</button>
    <button id="shot" type="button"
            title="Save the screen as a PNG, at the aspect shown. Shift for the Amiga's own pixels.">Screenshot</button>
    <button id="reset" type="button">Reset</button>
  </span>
  <span id="state"><i id="dot"></i><span id="word">idle</span></span>
</div>

<div id="stage">
  <div id="box" tabindex="0" title="click to type at it"></div>
</div>

<div id="deck">
  <button id="rec" type="button" aria-pressed="false" disabled>Record</button>
  <button id="play" type="button" disabled>Play</button>
  <button id="prev" type="button" disabled>&lt;</button>
  <button id="next" type="button" disabled>&gt;</button>
  <input id="scrub" type="range" min="0" max="0" value="0" disabled>
  <span id="count">-</span>
  <select id="aspect" title="how wide an Amiga pixel is">
    <option value="auto">aspect</option>
    <option value="square">1:1</option>
  </select>
  <select id="zoom">
    <option value="fit">fit</option>
    <option value="1">1x</option>
    <option value="2">2x</option>
    <option value="3">3x</option>
  </select>
  <button id="logtog" type="button" aria-pressed="false">log</button>
</div>

<div id="info">
  <span id="geom">-</span>
  <span id="perf"></span>
</div>

<div id="log" title="what would go to the Amiga, if anything there read it"></div>

<dialog id="ask">
  <p id="askwhat"></p>
  <div>
    <button id="askno" type="button" autofocus>Cancel</button>
    <button id="askyes" type="button"></button>
  </div>
</dialog>
