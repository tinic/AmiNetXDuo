<!doctype html>
<!--

  TypeScript inlined by tools/web/build-files.mjs. Edit this directory, not
  the generated page.

  SPDX-License-Identifier: MIT
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>AmiNetXDuo Files</title>
    <style>
      /*STYLE*/
    </style>
  </head>
  <body>
    <header>
      <div class="title">
        <span class="mark" aria-hidden="true"></span>
        <strong>AmiNetXDuo</strong>
        <span>Files</span>
      </div>
      <nav id="crumbs" aria-label="Current drawer"></nav>
      <div class="actions">
        <button id="up" type="button" title="Parent drawer">Up</button>
        <button id="refresh" type="button">Refresh</button>
        <button id="mkdir" type="button">New drawer</button>
        <button id="upload" class="primary" type="button">Upload</button>
        <input id="pick" type="file" multiple />
      </div>
    </header>

    <main>
      <div id="drop" class="drop">Drop files here to upload them</div>
      <div class="tablebox">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Size</th>
              <th>Modified</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty" hidden>This drawer is empty.</div>
      </div>
    </main>

    <footer>
      <span id="status" role="status" aria-live="polite">Ready</span>
      <progress id="progress" max="1" value="0" hidden></progress>
    </footer>

    <dialog id="ask">
      <form method="dialog">
        <h2 id="ask-title"></h2>
        <p id="ask-text"></p>
        <label id="ask-field"
          >Name<input id="ask-name" autocomplete="off"
        /></label>
        <div class="dialog-actions">
          <button value="cancel">Cancel</button>
          <button id="ask-ok" class="primary" value="ok">Continue</button>
        </div>
      </form>
    </dialog>

    <dialog id="editor-dialog" class="editor-dialog">
      <section class="editor-shell">
        <div class="editor-bar">
          <div class="editor-heading">
            <strong id="editor-name">File</strong>
            <span id="editor-path"></span>
          </div>
          <span id="editor-state">Saved</span>
          <button id="editor-close" type="button">Close</button>
          <button id="editor-save" class="primary" type="button">Save</button>
        </div>
        <div id="editor-host"></div>
        <div class="editor-foot">
          <span id="editor-message">Amiga 8-bit text</span>
          <span>Ctrl/Cmd+S saves · Ctrl/Cmd+F searches</span>
        </div>
      </section>
    </dialog>

    <script type="module">
      /*SCRIPT*/
    </script>
  </body>
</html>
