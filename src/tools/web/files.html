        <div id="empty" hidden>This drawer is empty.</div>

    </main>

    <footer>

      <progress id="progress" max="1" value="0" hidden></progress>
    </footer>

        <label id="ask-field"

        <div class="dialog-actions">
          <button value="cancel">Cancel</button>
          <button id="ask-ok" class="primary" value="ok">Continue</button>
        </div>
      </form>
    </dialog>
