# Tier 2 -- the on-Amiga tests, which need an emulator and a boot ROM.
#
# This is a SEPARATE workflow from ci.yml on purpose.  Tier 1 going green must
# never be mistaken for "the stack still works on a 68020"; those are different
# claims and they get different ticks.
#
# TWO ROMS, TWO JOBS
#
#   `kickstart` a real Kickstart 3.1 ROM plus Commodore's a2065.device.  Both
#               are copyrighted and neither may be redistributed, so this job
#               only runs on a self-hosted runner that already has them.  It is
#               the only tier that can run the SANA-II network tests and the
#               bsdsocktest conformance suite, because those need a driver.
#
# AMIBERRY, AND ONLY AMIBERRY.  Every arm below reaches tools/amiberry-run.sh,
# which is the one place that decides how a guest is booted, capped
# (tools/logcap.sh) and reaped.  This job was titled "FS-UAE on Kickstart 3.1"
# until 2026-08-16 and two of its harnesses were called run-fsuae.sh, but
# nothing here has started fs-uae since it left the tree on 2026-08-04: it
# needs an X server, and Xvfb is not the fix.  A name is what the next person
# reads as the decision, so the names now say what runs.
#
# SPDX-License-Identifier: MIT

name: Emulator

# Read-only: this tier boots an emulator and reports. It publishes nothing.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      run_kickstart:
        description: "Also run the Kickstart/self-hosted tier"
        type: boolean
        default: false
  schedule:
    # Nightly.
    - cron: "17 4 * * *"
  # Deliberately NOT on push. This tier boots an emulator and takes 7-20
  # minutes, so on an active day it is cancelled by the next push before it
  # finishes and reports nothing useful either way -- while still emailing on
  # every failure. Nightly plus on-demand gives the same coverage without the
  # noise, and tier 1 (ci.yml) still runs on every push.
  push:
    tags: ["v*"]

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ------------------------------------------------------------------------
  kickstart:
    name: Amiberry on Kickstart 3.1 (self-hosted)
    if: >
      vars.AMINETXDUO_KICKSTART_RUNNER != '' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_kickstart)
    runs-on: ${{ vars.AMINETXDUO_KICKSTART_RUNNER }}
    env:
      # Set these on the runner, or as repository variables.  They are PATHS
      # on that machine -- nothing copyrighted is ever uploaded to GitHub.
      AMINETXDUO_KICKSTART: ${{ vars.AMINETXDUO_KICKSTART }}
      AMINETXDUO_A2065: ${{ vars.AMINETXDUO_A2065 }}
      # The 68000 arm boots an A600, which an A1200 ROM will not start.
      AMINETXDUO_KICKSTART_A600: ${{ vars.AMINETXDUO_KICKSTART_A600 }}
      # install/test/run-workbench.sh: the Workbench 3.1 disks and Commodore's
      # Installer, neither of which is ours to ship.
      AMINETXDUO_ADF_DIR: ${{ vars.AMINETXDUO_ADF_DIR }}
      AMINETXDUO_INSTALLER: ${{ vars.AMINETXDUO_INSTALLER }}
      # A THIRD machine on the same LAN, as user@host, for both of the
      # harnesses that need one: the host running amiberry cannot reach its
      # own bridged guest -- a frame it sends there never comes back to that
      # NIC's pcap -- so with no peer run-workbench.sh -H has nothing to drive
      # WebDAV or the browser terminal from, and run-cardsweep.sh has nowhere
      # to count bytes from and calls every card unproven rather than passing
      # it.  Two variables because the two harnesses were wired separately.
      AMINETXDUO_PEER: ${{ vars.AMINETXDUO_PEER }}
      AMINETXDUO_CARDSWEEP_PEER: ${{ vars.AMINETXDUO_CARDSWEEP_PEER }}
      # run-tls13.sh is the third.  It used to serve from this machine over
      # SLIRP, and what that measured was the emulator's own TCP: the flight
      # after ServerHello decrypted and then the connection was reset from
      # inside the emulator, which no capture on this host can show.  Bridged
      # against a real peer the same binaries complete the handshake.
      AMINETXDUO_TLS13_PEER: ${{ vars.AMINETXDUO_TLS13_PEER }}
      # Which NIC the bridged arms put a guest on.  LEAVE IT UNSET unless the
      # bridge is not ens18: this one name means two things.  Every harness
      # that wants a NIC reads it as `${...:-ens18}`, but tools/amiberry-run.sh
      # reads it as the BACKEND, `${...:-slirp}`, so a value here moves every
      # arm that does not explicitly override it onto the bridge.  Nominal
      # SLIRP arms with literal 10.0.2.x assertions must force `slirp`, as
      # run-ifdhcp does, rather than inherit this value.
      AMINETXDUO_AMIBERRY_BACKEND: ${{ vars.AMINETXDUO_AMIBERRY_BACKEND }}
      # tests/tools/run-tcphandler.sh: Commodore's own `type` and `copy`, which
      # are the whole point of that harness and are not ours to ship.
      AMINETXDUO_AMIGA_C: ${{ vars.AMINETXDUO_AMIGA_C }}
      # tests/perf/run-lossgate.sh: the peer that induces loss, and its address
      # as the GUEST sees it.  It needs `tc` with CAP_NET_ADMIN there, which is
      # why it is a separate variable from AMINETXDUO_PEER even where it is the
      # same machine -- a peer without it is not a loss rig.
      AMINETXDUO_FITZ_PEER: ${{ vars.AMINETXDUO_FITZ_PEER }}
      AMINETXDUO_FITZ_PEER_ADDR: ${{ vars.AMINETXDUO_FITZ_PEER_ADDR }}
      # install/test/run-smbmount.sh: smb2-handler and filesysbox, neither ours.
      AMINETXDUO_SMB2FS: ${{ vars.AMINETXDUO_SMB2FS }}
      AMINETXDUO_FILESYSBOX: ${{ vars.AMINETXDUO_FILESYSBOX }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # THE PINNED TOOLCHAIN, WHICH THIS JOB NEVER ASKED FOR.
      #
      # ci.yml and release.yml both run this before they build; this job did
      # not, so it built with whatever the runner's cache happened to hold.
      # From 2026-08-14 that was GCC 15.2 under a `current` symlink left behind
      # by a broken swap in tools/fetch-toolchain.sh, while the pinned GCC
      # 16.2.0b tree sat unused in the same directory.  The only thing that
      # noticed was tools/gen-developer.sh --check, which called the committed
      # Developer headers stale because a different sfdc wrote them; the job
      # was red on that through v0.22.0, v0.22.1 and v0.23.0.
      #
      # The resolvers now select the pin by name and refuse a cache that is not
      # it, so a missing toolchain is an error rather than a wrong answer.  This
      # step is what stops that error being the outcome: it costs nothing when
      # the pin is already there and provisions the runner when it is not.
      - name: Toolchain
        run: tools/fetch-toolchain.sh

      - name: Check the ROM is really there
        run: |
          if [ ! -f "$AMINETXDUO_KICKSTART" ]; then
            echo "::error::AMINETXDUO_KICKSTART is set to '$AMINETXDUO_KICKSTART'," \
                 "which does not exist on this runner. Refusing to fall back to" \
                 "an AROS ROM: this tier exists to say what a real Kickstart 3.1" \
                 "does, and a run on a substitute would answer a different" \
                 "question under the same name."
            exit 1
          fi

      # One build, both machines.  AMINETXDUO_CPU=any means the shipping
      # binary is what runs on the A600 too, so there is no 68000 tree to
      # build -- and "m68000" stopped being a configuration when that landed.
      - name: Build the shipping configuration
        id: build
        run: AMINETXDUO_CI_CROSS="default" tools/ci.sh cross

      - name: Run the on-Amiga harnesses
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "On-Amiga harnesses, 68020 and 68000" --
          tools/ci.sh emulator

      # a2065.device is what the network and conformance tiers need, and it
      # exists only here.
      - name: Conformance suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "bsdsocktest conformance suite"
          -r AMINETXDUO_A2065 -- sh -c
          'tests/conformance/build.sh -b build/ci/default &&
          tests/conformance/run-conformance.sh -b build/ci/default -a "LOOPBACK NOPAGE"'

      # The whole RFC 3542 surface -- IPV6_RECVPKTINFO and
      # IP_PKTINFO arriving together on one datagram, both hop-limit paths read
      # off the wire, the arrival index through if_indextoname() and back. It
      # ran green by hand from the day it was written and nothing re-ran it,
      # which is the state every regression starts in.
      #
      # NOT gated on AMINETXDUO_A2065, unlike the conformance step above: the
      # test installs its own SANA-II device (tests/tcpdrill/tapdev.c) before it
      # opens the library, so it needs no driver anyone has to supply. A ROM is
      # the whole requirement.
      #
      # The harness grades on the guest's own counters, from stdout.txt or the
      # serial log, whichever arrived; 134 checks against a floor of 120.  It
      # used to carry -A here, which picked between two branches that both ran
      # Amiberry; the branch is gone and the invocation is the same run.
      - name: IPv6 socket surface
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "IPv6 socket surface (RFC 3542)" --
          tests/ipv6/run-socket.sh -b build/ci/default

      # The same argument as the step above, and the same requirements: the
      # test brings up tests/tcpdrill/tapdev.c itself, so a ROM is the whole
      # of it -- no driver, no card, no peer -- and 113 checks run in 19
      # seconds.  It had been UNWIRED since it was written.
      #
      # It was called tests/sockopt/run-fsuae.sh, and it asked for -N a2065
      # while staging no driver for it, so on a host with
      # AMINETXDUO_AMIBERRY_BACKEND set it failed the backend assertion in
      # tools/amiberry-run.sh over a transcript ending `113 checks, 0
      # failures, PASS`.  It asks for no card now.
      - name: The socket-option surface
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "socket options, getsockopt/setsockopt/IoctlSocket" --
          tests/sockopt/run-sockopt.sh -b build/ci/default

      # src/crypto68k's assembly against the portable C it also compiles, on
      # the machine.  The host tier runs the same vectors every push and cannot
      # reach the assembly at all: it is m68k, and it is DIFFERENT code per
      # part -- MULU.L on a 68020, four MULU.W on a 68000 -- so a green host
      # run says nothing about either.  All three programs had been built by
      # every cross configuration and run by nothing.
      #
      # No library, no driver, no card, no peer: each links its own reference
      # and compares.  The harness picks its machines; see its header for why
      # the wide modexp pass runs on one arm and not two.
      - name: crypto68k, on the machine
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "crypto68k assembly vs its reference" --
          tests/crypto68k/run-crypto.sh -b build/ci/default

      # The late-LTO regression for crypto68k's P-256, which needs a build
      # directory nothing else configures: AMINETXDUO_CRYPTO68K_LTO_PROBE=ON,
      # and only the FULL tls.library link reproduces the libcall the P-256
      # path lost.  The stage does the configure, builds two targets and runs
      # it -- about fifteen seconds in the guest.  A ROM and nothing else.
      - name: crypto68k survives the tls.library LTO link
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "P-256 through a real tls.library link" --
          tools/ci.sh ltoprobe

      # The sequences a ported client issues, as against the vectors it calls:
      # non-blocking connect then writable then SO_ERROR, a wide sparse select
      # set, FIONREAD before a read, half-close both ways.  1651 lines and 100
      # assertions, copied from curl, wget and nc, and run by nothing until
      # now.
      #
      # A2065-GATED, unlike the three steps above.  client_patterns.c reaches
      # bsdsocket.library through its LVOs and does not install an interface of
      # its own, so the library needs a real driver to bring the stack up on --
      # even though every byte the test moves is over 127.0.0.1.  Giving it
      # tapdev.c the way sockopt_test and ipv6_socket_test have it is what
      # would drop this gate.
      #
      # tests/clients/build.sh first: it is compiled against the Roadshow NDK
      # with tests/conformance/compat ahead of it, not by the CMake tree, which
      # is the same reason the conformance step above is two commands.
      - name: The access patterns real clients use
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "client access patterns (curl, wget, nc)"
          -r AMINETXDUO_A2065 -- sh -c
          'tests/clients/build.sh &&
          tests/clients/run-clients.sh -b build/ci/default'

      # One binary for every 68k means the compiler runtime picks its MULU.L
      # and DIVU.L paths from AttnFlags at run time, and a green run on one
      # machine says nothing about the others.  Five boots, no NIC and no peer,
      # all five at once.  It found three helpers that had compiled into calls
      # to themselves.
      - name: the compiler runtime, on every CPU class
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "the compiler runtime, on every CPU class" --
          tests/common/run-rt.sh -b build/ci/default

      # The same regression, one tier down and in a minute rather than ten.
      # A bare drive shows it as an interface that comes up with no address,
      # where a real Workbench shows it as a machine that stops booting; the
      # cause is one thing, the IP thread blocked on sb_Lock so the lease never
      # completes.  Needs a driver, hence the A2065 gate.
      - name: AddNetInterface comes back
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "AddNetInterface comes back"
          -r AMINETXDUO_A2065 --
          tests/tools/run-addifup.sh -b build/ci/default

      # The commands that change the machine's network configuration, each
      # over its own whole surface: the interface switched down and up and
      # asserted with a ping in every state, the configuration file written
      # and read back off the drive, the mDNS browse and its window. All four
      # are SLIRP, so they need the driver and no peer, and none takes longer
      # than half a minute.
      #
      # RemoveNetInterface shipped in 0.20.0 broken in the one thing its own
      # header promised, because a compile was all that ever ran over it.
      # These are here so the same cannot happen quietly again.
      - name: RemoveNetInterface frees its slot
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "RemoveNetInterface frees its slot"
          -r AMINETXDUO_A2065 --
          tests/tools/run-ifremove.sh -b build/ci/default

      - name: Online and Offline
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "Online and Offline"
          -r AMINETXDUO_A2065 --
          tests/tools/run-onoff.sh -b build/ci/default

      # ConfigureNetInterface changes the three numbers on an interface that
      # stays where it is.  The counter assertion is the one that matters: a
      # command that quietly fell back to a remove and an add would pass every
      # assertion about the address and fail that one.
      - name: ConfigureNetInterface changes an interface in place
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "ConfigureNetInterface changes an interface in place"
          -r AMINETXDUO_A2065 --
          tests/tools/run-ifconfigure.sh -b build/ci/default

      # The DHCP half of the same command, which needs a server and so an
      # interface with a second writer.  A separate file for that reason, not
      # because it is a separate command.
      - name: ConfigureNetInterface releases and renews a lease
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "ConfigureNetInterface releases and renews a lease"
          -r AMINETXDUO_A2065 --
          tests/tools/run-ifdhcp.sh -b build/ci/default

      # Two boots: one where ENV:HOSTNAME is the strongest source that has
      # named the machine, and one where DEVS:Internet/name_resolution
      # outranks it and the same command has to refuse.  ENVARC: is read off
      # the host afterwards, which is the only witness there is for the half
      # that survives a reboot.
      - name: hostname reports its source and respects the ranking
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "hostname reports its source and respects the ranking"
          -r AMINETXDUO_A2065 --
          tests/tools/run-hostname.sh -b build/ci/default

      - name: NetSetup writes a usable configuration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "NetSetup writes a usable configuration"
          -r AMINETXDUO_A2065 --
          tests/tools/run-netsetup.sh -b build/ci/default

      - name: ShowNetServices and its window
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "ShowNetServices and its window"
          -r AMINETXDUO_A2065 --
          tests/tools/run-shownetservices.sh -b build/ci/default

      # Every QUIET in the tree, each command run twice and the two outputs
      # compared.  Eleven of them gated their own error messages behind the
      # flag, so a User-Startup line that could not find its interface file
      # said nothing at all; a compile could not see it and no test ever ran a
      # command twice.
      - name: QUIET means the same thing everywhere
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "QUIET means the same thing everywhere"
          -r AMINETXDUO_A2065 --
          tests/tools/run-quiet.sh -b build/ci/default

      # MDNS= as a switch rather than a boot-time reading: on, off, on again,
      # and an interface removed and re-added that must not claim it.  The two
      # that matter are the off and the re-add, which are what a flag that is
      # set and never acted on passes anyway.  Exit 3 is "the host-side half was
      # not measured", which SLIRP decides, so it is not a failure -- but it is
      # not a pass either, and -s is what makes the row say SKIPPED rather than
      # tick the arm off as measured.
      - name: mDNS switched on and off at runtime
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "mDNS switched on and off at runtime"
          -r AMINETXDUO_A2065 -s 3 -m "3 = the host-side half was not measured"
          -- tests/tools/run-mdnsctl.sh -b build/ci/default

      # Two boots with two hardware addresses and nothing naming either
      # machine: they must take two different names.  A constant fallback
      # passes a one-machine test, which is how every unconfigured machine
      # came to claim amiga.local.
      - name: two unnamed machines take two names
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "two unnamed machines take two names"
          -r AMINETXDUO_A2065 --
          tests/tools/run-hostname-mac.sh -b build/ci/default

      # iperf, against a peer that counts what actually arrived.  What this
      # arm proves is the BYTE COUNTS, which are exact on any link: SLIRP has
      # no delay term and the emulator runs in warp mode, so no throughput
      # figure it produces means anything and the script says so.  The two
      # directions with the guest as the server need a peer that can call in,
      # which a SLIRP guest has none of; they run under -B on a rig with a
      # third machine, the same reason run-httpd.sh is not here.
      - name: iperf measures what crossed the wire
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "iperf measures what crossed the wire"
          -r AMINETXDUO_A2065 --
          tests/tools/run-iperf.sh -b build/ci/default

      # A TLS 1.3 handshake end to end, against a peer that will not fall
      # back to 1.2, on both tiers -- and the second one is not redundant.
      # A 68020 takes the hand-written limb primitives in c68k_prim.S; a
      # 68060 cannot, because MULU.L's 32x32 -> 64 form was dropped from
      # that part, so it runs the portable C instead. The carry-in bug that
      # stopped 68060 TLS 1.3 was in that C and a green 68020 run said
      # nothing about it. Two arms, two code paths.
      - name: TLS 1.3 handshake, 68020
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "TLS 1.3 handshake, 68020"
          -r AMINETXDUO_A2065 -r AMINETXDUO_TLS13_PEER --
          tests/tls/run-tls13.sh -b build/ci/default -c 68020

      - name: TLS 1.3 handshake, 68060
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "TLS 1.3 handshake, 68060"
          -r AMINETXDUO_A2065 -r AMINETXDUO_TLS13_PEER --
          tests/tls/run-tls13.sh -b build/ci/default -c 68060

      # The other half of the record layer: TLS 1.2 with a CBC suite, where
      # RFC 7366 and RFC 7627 apply and TLS 1.3 has nothing to say.  The
      # server is openssl s_server, because it will report which extensions
      # it saw and which it answered, and the guest's own account of that is
      # what is under test.
      - name: TLS 1.2 encrypt-then-MAC and extended master secret
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "TLS 1.2 encrypt-then-MAC and extended master secret"
          -r AMINETXDUO_A2065 -r AMINETXDUO_TLS13_PEER --
          tests/tls/run-tls12ext.sh -b build/ci/default -c 68020

      # EVERY NETWORK CARD, ONE BOOT EACH.
      #
      # Everything above this line, and install/test/run-workbench.sh below it,
      # boots ONE card: the a2065.  The other eight drivers this project
      # supports had only ever been run by hand, in a throwaway tree, and
      # x-surf-100 reached a user broken because of it.
      #
      # Nine guests, so it is the longest step in the file -- see the wall_s
      # column it prints.  It is here rather than in ci.yml for that reason and
      # because it needs a bridged NIC and a peer, neither of which a hosted
      # runner has.  Skipped, loudly and per card, where the peer is not set.
      - name: Every network card carries bytes both ways
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "Every network card carries bytes both ways"
          -r AMINETXDUO_A2065 -r AMINETXDUO_CARDSWEEP_PEER --
          tools/ci.sh cards

      # EVERY NETWORK CARD AGAIN, AND A DIFFERENT QUESTION: OFF-LAN IPv6.
      #
      # The step above is IPv4 and one segment, and it passed for months while
      # x-surf, x-surf-100 Z2 and Z3 could not reach a single address past the
      # router: their drivers refuse every S2_ADDMULTICASTADDRESS, so the
      # router's neighbour solicitation for the guest was dropped by the card.
      # Nothing under tests/ipv6 could have caught it either -- WinUAE or
      # SLIRP, and SLIRP answers a router solicitation itself.
      #
      # No peer: nothing calls into the guest.  It does need the LAN's IPv6 to
      # be up, and it exits 2 and says so rather than reddening nine cards
      # when it is not.
      - name: Every network card reaches past the router over IPv6
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "Every network card reaches past the router over IPv6"
          -r AMINETXDUO_A2065 --
          tools/ci.sh cards6

      # THE STAGES tools/ci.sh HAD AND NO WORKFLOW EVER NAMED.
      #
      # tests/HARNESSES called twelve harnesses wired to tools/ci.sh while the
      # only thing that ran their stage was a person typing it, so twelve rows
      # read as coverage and were not.  tools/check-harnesses.sh computes the
      # schedule now and the four steps below and the e2e-cards one further
      # down are what make those rows true rather than relabelled.
      #
      # Every machine but the A1200's 68EC020: 68030/68040/68060 at two clocks,
      # 32 MB and 128 MB of Fast, three to eight interface definitions in one
      # drawer, the wording every bring-up failure gets, which interface takes
      # a slot when the drawer describes more than there are, an interface
      # removed out from under another on the same device unit, seven kinds of
      # wrong DEVS: that a parser cannot see, and httpd from S:User-Startup on
      # a machine with no screen.  A ROM and a driver; no peer.
      - name: The machine matrix
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "CPU, memory, interface count and refusal wording"
          -r AMINETXDUO_A2065 --
          tools/ci.sh matrix

      # NetCapture on every card, read back with tcpdump: the frames are
      # ping's, and the filter is checked against an unfiltered capture of the
      # same seconds.  The peer is optional and its absence is a skipped HALF,
      # not a skipped arm -- without one the pcap files are read by the machine
      # that wrote them.
      - name: NetCapture, every card
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "NetCapture writes files another machine can read"
          -r AMINETXDUO_A2065 --
          tools/ci.sh capture

      # What the machine puts on the wire when nobody asked it to.  Nothing
      # else here asserts on what the guest EMITS, which is how a DHCPv6 client
      # rebinding twenty-five times a second passed every other stage.
      - name: The wire, with the machine idle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "every card goes quiet after bring-up"
          -r AMINETXDUO_A2065 --
          tools/ci.sh wirequiet

      # Is the machine still on the network while it is inside a certificate
      # chain?  It was not: the peer's neighbour entry went FAILED for about
      # 44 s.  The gate is the longest stretch of silence, probed from the peer
      # once a second, so a peer is a requirement rather than a half.
      - name: Reachable during a TLS handshake
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "the machine answers throughout a TLS handshake"
          -r AMINETXDUO_A2065 -r AMINETXDUO_PEER --
          tools/ci.sh reachability

      # THE TWO REGRESSION TESTS THAT NEEDED A REAL LINK AND SO HAD NO HOME.
      #
      # NetShutdown against live services -- httpd serving, nc listening, two
      # holders inside and outside WaitSelect() -- is the regression test for a
      # defect a USER reported: our shutdown took the interfaces down and left
      # every program holding a library whose network had gone.  The TCP: half
      # runs Commodore's own Type and Copy over a socket, which is the only
      # place in the tree that a stock command touches the stack at all.
      #
      # Both were written, both went green by hand, and nothing ran either of
      # them again.  The TCP: half is skipped, loudly, where there is no peer.
      - name: "NetShutdown and the TCP: handler"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "NetShutdown and the TCP: handler"
          -r AMINETXDUO_A2065 --
          tools/ci.sh bridged

      # THE ONLY RIG THAT CAN PRICE AN ACK OR RETRANSMIT CHANGE.
      #
      # Every other arm here measures a link that loses nothing, so a change to
      # acknowledgement or retransmission behaviour is free on all of them --
      # and 0.16.6 shipped two, with the read direction down 18% on real
      # hardware while every arm we ran said the opposite.  netem on the peer is
      # what gives such a change a price, and the medians are gated against
      # tests/perf/lossgate-baseline.txt.
      #
      # It changes the PEER's root qdisc for the duration, so the peer must be
      # idle; the harness refuses to start otherwise.
      - name: Throughput on a link that loses packets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "Throughput on a link that loses packets"
          -r AMINETXDUO_A2065 -r AMINETXDUO_FITZ_PEER -r AMINETXDUO_FITZ_PEER_ADDR
          -- sh -c
          'tests/endurance/fetch-fitz.sh && tools/ci.sh lossgate'

      # SMB, WHICH HAD NO COVERAGE AT ALL.
      #
      # GitHub #3 ("opening SMB2 to the LAN never responds") and #4 ("mounting
      # SMB freezes system") were both unreproducible for a day, because
      # nothing here had ever mounted a share over this stack.  Neither is
      # reachable from a socket test: `nc` connects to 445 from a booted A1200
      # perfectly well, so whatever fails happens above the handshake, inside
      # smb2-handler, and only a machine that can Mount can show it.
      #
      # A real Workbench, Commodore's Mount, and a share the harness stands up
      # itself on the peer -- not one that happens to be running on the LAN,
      # which is a test whose result depends on somebody else's uptime.
      - name: Mount an SMB share on a real Workbench
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "Mount an SMB share on a real Workbench"
          -r AMINETXDUO_A2065 -r AMINETXDUO_ADF_DIR -r AMINETXDUO_SMB2FS
          -r AMINETXDUO_FILESYSBOX -r AMINETXDUO_PEER --
          tools/ci.sh smb

      # THE ONE THAT WOULD HAVE STOPPED 0.17.0 AND 0.17.1 SHIPPING.
      #
      # Everything above runs a test program on a bare directory drive.  This
      # installs the release archive on a real Workbench 3.1 through Commodore's
      # Installer, power cycles, and lets the stock Startup-Sequence reach
      # S:User-Startup on its own -- which is where those two releases stopped,
      # deadlocked in bsd_address_changed() the moment a DHCP lease arrived.
      # Tier 2 was green throughout: none of it opens bsdsocket.library against
      # a real SANA-II driver and lets DHCP run.
      #
      # Runs on tags, where a release is being cut, and on demand.  Needs the
      # ADFs and the Installer, so it is skipped rather than failed where they
      # are not configured; the arm table says so per arm.
      #
      # TWO configurations, and they are what .github/workflows/release.yml
      # packs, so a break in either is a break in something a user downloads,
      # whether or not this machine has the floppies to install it on.  It was
      # four -- one per CPU -- until the CPU left the archive.
      - name: Build the release archive
        id: dist
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cmake -S . -B build/cm \
                -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-m68k-amigaos.cmake \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cm --parallel
          cmake -S . -B build/cm-minimal \
                -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-m68k-amigaos.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                -DAMINETXDUO_IPV6=OFF -DAMINETXDUO_MDNS=OFF -DAMINETXDUO_BPF=OFF \
                -DAMINETXDUO_TLS=OFF -DAMINETXDUO_MULTICAST=OFF \
                -DAMINETXDUO_AREXX=OFF -DAMINETXDUO_TCPDEVICE=OFF
          cmake --build build/cm-minimal --parallel
          dist/make-dist.sh

      # -H IS THE HALF THIS ARM CLAIMS TO DO, and it is why the arm goes
      # through tools/ci.sh rather than calling run-workbench.sh here.  Without
      # -H, TERMINAL stays 0 (install/test/run-workbench.sh:144) and the whole
      # block at :1000 to :1223 is skipped: no peer is contacted,
      # tests/tools/httpd-drill.py's twelve WebDAV assertions do not run,
      # wsterm-console.py does not run, the PUT/GET round trip does not run,
      # `lha x` on the Amiga does not run, and the second and third installs --
      # install-over-existing, and answering the terminal question no -- do not
      # happen at all.  What ran instead was one install, a boot, and a check
      # that some files exist.
      #
      # This file used to spell that fallback out itself and take it when
      # AMINETXDUO_PEER was unset: a quarter of the test, reported as the whole
      # of it with a warning beside it.  A peer is now a REQUIREMENT of the
      # arm, so a runner without one gets a SKIPPED row and no result at all,
      # which is the true statement.  tools/ci.sh's e2e stage is the same
      # invocation a person runs by hand.
      - name: Release archive on a real Workbench 3.1
        if: ${{ !cancelled() && steps.dist.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "Release archive on a real Workbench 3.1"
          -r AMINETXDUO_ADF_DIR -r AMINETXDUO_INSTALLER -r AMINETXDUO_PEER --
          tools/ci.sh e2e

      # THE SAME INSTALL, ON EVERY CARD.  The step above boots the A2065 and
      # nothing else, and did so silently: run-workbench.sh staged the driver
      # by name and wrote two literal a2065 lines into the emulator config, so
      # every release this project has cut was gated on one network card.
      #
      # A narrower question than the step above and a different ingredient
      # list: no peer, because nothing drives the machine from outside it, but
      # the vendor drivers have to be in the asset store.  Does the archive
      # install, and does the power cycle bring the network up on THIS card.
      - name: Release archive on every card
        if: ${{ !cancelled() && steps.dist.outcome == 'success' }}
        run: >-
          tools/ci-arm.sh -n "Release archive on a real Workbench, every card"
          -r AMINETXDUO_ADF_DIR -r AMINETXDUO_INSTALLER --
          tools/ci.sh e2ecards

      # A CANCELLED RUN LEAVES ITS GUESTS BEHIND.
      #
      # `concurrency: cancel-in-progress` cancels this workflow the moment
      # another run of it starts.  On a hosted runner the whole VM goes with
      # it; here the machine stays, and an amiberry from the cancelled run
      # keeps running with its tag, its serial port and its testhd directory.
      # The next run takes the same three and shares them with a guest nobody
      # is reading -- which produces a corrupted artifact rather than a failed
      # one, and those are much harder to notice.  Seen for real on 2026-08-12.
      #
      # Scoped to this job's workspace through the config path amiberry was
      # started with, so it cannot reach the demo guest or any other checkout
      # on the same machine.
      - name: Leave no guests behind
        if: always()
        run: |
          pat="amiberry .*$GITHUB_WORKSPACE/build/"
          pkill -f "$pat" || true
          sleep 2
          pkill -KILL -f "$pat" || true
          echo "leftover_guests=$(pgrep -cf "$pat" || true)"

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # amiberry-run.sh writes build/amiberry-testhd-<tag>/, not
          # build/testhd-<tag>/, so the conformance TAP log was never
          # collected -- which mattered while run-fsuae.sh exited 0 on every
          # run and grading it by hand was the only way to see a failure.
          name: emulator-logs-kickstart
          path: |
            build/ci/emu-*.log
            build/serial*.log
            build/amiberry-testhd-*/bsdsocktest.log
            build/amiberry-testhd-*/conf-out.txt
            build/cardsweep-results.txt
            build/cardsweep-logs/*.log
            build/lossgate-*/median.txt
            build/lossgate-*/samples.txt
            build/smb-*-serial.log
            build/smbhd-*/smbcheck.txt
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------------------
  # Say, in the run summary, which tiers actually ran -- and FAIL where one
  # that was supposed to run did not.
  #
  # This job used to print a warning and exit 0.  Between 2026-08-05 and
  # 2026-08-12 that is exactly what it did, every night: AMINETXDUO_KICKSTART_RUNNER
  # was never set, so `kickstart` was skipped and the whole workflow finished
  # green in six to fourteen seconds having booted nothing.  Twenty-two wired
  # harnesses -- the card sweep, the release e2e, SMB, the loss gate, TLS, DNS
  # -- reported success by not running.  A warning is not a result; a green
  # tick that means "we did not look" is worse than a red one.
  #
  # A workflow_dispatch that did not ask for the tier is the one case where not
  # running is the intended outcome, and it is the only one excused.
  # ------------------------------------------------------------------------
  gate:
    name: tier report
    runs-on: ubuntu-latest
    needs: [kickstart]
    if: always()
    env:
      RESULT: ${{ needs.kickstart.result }}
      # true when the tier was asked for: nightly, a tag, or a dispatch that
      # ticked the box.
      EXPECTED: ${{ github.event_name != 'workflow_dispatch' || inputs.run_kickstart }}
    steps:
      - name: Report
        run: |
          {
            echo "## Emulator tiers"
            echo
            echo "| tier | ROM | expected | result |"
            echo "|---|---|---|---|"
            echo "| Kickstart 3.1 | self-hosted only | $EXPECTED | $RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$RESULT" = "skipped" ] || exit 0

          {
            echo
            echo "> **The Kickstart tier did not run.** The SANA-II network"
            echo "> tests, the card sweep, SMB, the loss gate, TLS and the"
            echo "> release end-to-end are unverified for this commit."
            echo ">"
            echo "> \`vars.AMINETXDUO_KICKSTART_RUNNER\` names the self-hosted"
            echo "> runner label this tier runs on. With it unset there is no"
            echo "> machine with a ROM on it and the job cannot start."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$EXPECTED" = "true" ]; then
            echo "::error::The Kickstart 3.1 tier did NOT run, on a run that" \
                 "expected it. Set the repository variable" \
                 "AMINETXDUO_KICKSTART_RUNNER to a self-hosted runner label." \
                 "Nothing on an Amiga was tested by this run."
            exit 1
          fi
          echo "::notice::The Kickstart 3.1 tier was not requested by this" \
               "dispatch, so it did not run."
