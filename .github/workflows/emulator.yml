# Tier 2 -- the on-Amiga tests, which need an emulator and a boot ROM.
#
# This is a SEPARATE workflow from ci.yml on purpose.  Tier 1 going green must
# never be mistaken for "the stack still works on a 68020"; those are different
# claims and they get different ticks.
#
# TWO ROMS, TWO JOBS
#
#   `kickstart` a real Kickstart 3.1 ROM plus Commodore's a2065.device.  Both
#               are copyrighted and neither may be redistributed, so this job
#               only runs on a self-hosted runner that already has them.  It is
#               the only tier that can run the SANA-II network tests and the
#               bsdsocktest conformance suite, because those need a driver.
#
# SPDX-License-Identifier: MIT

name: Emulator

# Read-only: this tier boots an emulator and reports. It publishes nothing.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      run_kickstart:
        description: "Also run the Kickstart/self-hosted tier"
        type: boolean
        default: false
  schedule:
    # Nightly.
    - cron: "17 4 * * *"
  # Deliberately NOT on push. This tier boots an emulator and takes 7-20
  # minutes, so on an active day it is cancelled by the next push before it
  # finishes and reports nothing useful either way -- while still emailing on
  # every failure. Nightly plus on-demand gives the same coverage without the
  # noise, and tier 1 (ci.yml) still runs on every push.
  push:
    tags: ["v*"]

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ------------------------------------------------------------------------
  kickstart:
    name: FS-UAE on Kickstart 3.1 (self-hosted)
    if: >
      vars.AMINETXDUO_KICKSTART_RUNNER != '' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_kickstart)
    runs-on: ${{ vars.AMINETXDUO_KICKSTART_RUNNER }}
    env:
      # Set these on the runner, or as repository variables.  They are PATHS
      # on that machine -- nothing copyrighted is ever uploaded to GitHub.
      AMINETXDUO_KICKSTART: ${{ vars.AMINETXDUO_KICKSTART }}
      AMINETXDUO_A2065: ${{ vars.AMINETXDUO_A2065 }}
      # The 68000 arm boots an A600, which an A1200 ROM will not start.
      AMINETXDUO_KICKSTART_A600: ${{ vars.AMINETXDUO_KICKSTART_A600 }}
      # install/test/run-workbench.sh: the Workbench 3.1 disks and Commodore's
      # Installer, neither of which is ours to ship.
      AMINETXDUO_ADF_DIR: ${{ vars.AMINETXDUO_ADF_DIR }}
      AMINETXDUO_INSTALLER: ${{ vars.AMINETXDUO_INSTALLER }}
      # A THIRD machine on the same LAN, as user@host, for both of the
      # harnesses that need one: the host running amiberry cannot reach its
      # own bridged guest -- a frame it sends there never comes back to that
      # NIC's pcap -- so with no peer run-workbench.sh -H has nothing to drive
      # WebDAV or the browser terminal from, and run-cardsweep.sh has nowhere
      # to count bytes from and calls every card unproven rather than passing
      # it.  Two variables because the two harnesses were wired separately.
      AMINETXDUO_PEER: ${{ vars.AMINETXDUO_PEER }}
      AMINETXDUO_CARDSWEEP_PEER: ${{ vars.AMINETXDUO_CARDSWEEP_PEER }}
      # Which NIC the bridged arms put a guest on.  Empty is fine: every
      # harness spells its default with :- and lands on ens18.
      AMINETXDUO_AMIBERRY_BACKEND: ${{ vars.AMINETXDUO_AMIBERRY_BACKEND }}
      # tests/tools/run-tcphandler.sh: Commodore's own `type` and `copy`, which
      # are the whole point of that harness and are not ours to ship.
      AMINETXDUO_AMIGA_C: ${{ vars.AMINETXDUO_AMIGA_C }}
      # tests/perf/run-lossgate.sh: the peer that induces loss, and its address
      # as the GUEST sees it.  It needs `tc` with CAP_NET_ADMIN there, which is
      # why it is a separate variable from AMINETXDUO_PEER even where it is the
      # same machine -- a peer without it is not a loss rig.
      AMINETXDUO_FITZ_PEER: ${{ vars.AMINETXDUO_FITZ_PEER }}
      AMINETXDUO_FITZ_PEER_ADDR: ${{ vars.AMINETXDUO_FITZ_PEER_ADDR }}
      # install/test/run-smbmount.sh: smb2-handler and filesysbox, neither ours.
      AMINETXDUO_SMB2FS: ${{ vars.AMINETXDUO_SMB2FS }}
      AMINETXDUO_FILESYSBOX: ${{ vars.AMINETXDUO_FILESYSBOX }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check the ROM is really there
        run: |
          if [ ! -f "$AMINETXDUO_KICKSTART" ]; then
            echo "::error::AMINETXDUO_KICKSTART is set to '$AMINETXDUO_KICKSTART'," \
                 "which does not exist on this runner. Refusing to fall back to" \
                 "happened."
            exit 1
          fi

      - name: Build the default and 68000 configurations
        run: AMINETXDUO_CI_CROSS="default m68000" tools/ci.sh cross

      - name: Run the on-Amiga harnesses
        run: tools/ci.sh emulator

      # a2065.device is what the network and conformance tiers need, and it
      # exists only here.
      - name: Conformance suite
        if: env.AMINETXDUO_A2065 != ''
        run: |
          tests/conformance/build.sh
          tests/conformance/run-fsuae.sh -b build/ci/default -a "LOOPBACK NOPAGE"

      # 129 checks over the whole RFC 3542 surface -- IPV6_RECVPKTINFO and
      # IP_PKTINFO arriving together on one datagram, both hop-limit paths read
      # off the wire, the arrival index through if_indextoname() and back. It
      # ran green by hand from the day it was written and nothing re-ran it,
      # which is the state every regression starts in.
      #
      # NOT gated on AMINETXDUO_A2065, unlike the conformance step above: the
      # test installs its own SANA-II device (tests/tcpdrill/tapdev.c) before it
      # opens the library, so it needs no driver anyone has to supply. A ROM is
      # the whole requirement.
      #
      # -A because this runner is headless and FS-UAE dies in GLAD before the
      # guest boots. The results are on the SERIAL log, not the guest's
      # stdout.txt -- the harness prints the verdict either way.
      - name: IPv6 socket surface
        run: tests/ipv6/run-socket-fsuae.sh -A -b build/ci/default

      # The same regression, one tier down and in a minute rather than ten.
      # A bare drive shows it as an interface that comes up with no address,
      # where a real Workbench shows it as a machine that stops booting; the
      # cause is one thing, the IP thread blocked on sb_Lock so the lease never
      # completes.  Needs a driver, hence the A2065 gate.
      - name: AddNetInterface comes back
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tools/run-addifup.sh -b build/ci/default

      # The commands that change the machine's network configuration, each
      # over its own whole surface: the interface switched down and up and
      # asserted with a ping in every state, the configuration file written
      # and read back off the drive, the mDNS browse and its window. All four
      # are SLIRP, so they need the driver and no peer, and none takes longer
      # than half a minute.
      #
      # RemoveNetInterface shipped in 0.20.0 broken in the one thing its own
      # header promised, because a compile was all that ever ran over it.
      # These are here so the same cannot happen quietly again.
      - name: RemoveNetInterface frees its slot
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tools/run-ifremove.sh -b build/ci/default

      - name: Online and Offline
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tools/run-onoff.sh -b build/ci/default

      # ConfigureNetInterface changes the three numbers on an interface that
      # stays where it is.  The counter assertion is the one that matters: a
      # command that quietly fell back to a remove and an add would pass every
      # assertion about the address and fail that one.
      - name: ConfigureNetInterface changes an interface in place
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tools/run-ifconfigure.sh -b build/ci/default

      # The DHCP half of the same command, which needs a server and so an
      # interface with a second writer.  A separate file for that reason, not
      # because it is a separate command.
      - name: ConfigureNetInterface releases and renews a lease
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tools/run-ifdhcp.sh -b build/ci/default

      # Two boots: one where ENV:HOSTNAME is the strongest source that has
      # named the machine, and one where DEVS:Internet/name_resolution
      # outranks it and the same command has to refuse.  ENVARC: is read off
      # the host afterwards, which is the only witness there is for the half
      # that survives a reboot.
      - name: hostname reports its source and respects the ranking
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tools/run-hostname.sh -b build/ci/default

      - name: NetSetup writes a usable configuration
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tools/run-netsetup.sh -b build/ci/default

      - name: ShowNetServices and its window
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tools/run-shownetservices.sh -b build/ci/default

      # Every QUIET in the tree, each command run twice and the two outputs
      # compared.  Eleven of them gated their own error messages behind the
      # flag, so a User-Startup line that could not find its interface file
      # said nothing at all; a compile could not see it and no test ever ran a
      # command twice.
      - name: QUIET means the same thing everywhere
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tools/run-quiet.sh -b build/ci/default

      # MDNS= as a switch rather than a boot-time reading: on, off, on again,
      # and an interface removed and re-added that must not claim it.  The two
      # that matter are the off and the re-add, which are what a flag that is
      # set and never acted on passes anyway.  Exit 3 is "the host-side half was
      # not measured", which SLIRP decides, so it is not a failure.
      - name: mDNS switched on and off at runtime
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tools/run-mdnsctl.sh -b build/ci/default || [ $? = 3 ]

      # Two boots with two hardware addresses and nothing naming either
      # machine: they must take two different names.  A constant fallback
      # passes a one-machine test, which is how every unconfigured machine
      # came to claim amiga.local.
      - name: two unnamed machines take two names
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tools/run-hostname-mac.sh -b build/ci/default

      # iperf, against a peer that counts what actually arrived.  What this
      # arm proves is the BYTE COUNTS, which are exact on any link: SLIRP has
      # no delay term and the emulator runs in warp mode, so no throughput
      # figure it produces means anything and the script says so.  The two
      # directions with the guest as the server need a peer that can call in,
      # which a SLIRP guest has none of; they run under -B on a rig with a
      # third machine, the same reason run-httpd.sh is not here.
      - name: iperf measures what crossed the wire
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tools/run-iperf.sh -b build/ci/default

      # A TLS 1.3 handshake end to end, against a peer that will not fall
      # back to 1.2, on both tiers -- and the second one is not redundant.
      # A 68020 takes the hand-written limb primitives in c68k_prim.S; a
      # 68060 cannot, because MULU.L's 32x32 -> 64 form was dropped from
      # that part, so it runs the portable C instead. The carry-in bug that
      # stopped 68060 TLS 1.3 was in that C and a green 68020 run said
      # nothing about it. Two arms, two code paths.
      - name: TLS 1.3 handshake, 68020
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tls/run-tls13.sh -b build/ci/default -c 68020

      - name: TLS 1.3 handshake, 68060
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tls/run-tls13.sh -b build/ci/default -c 68060

      # EVERY NETWORK CARD, ONE BOOT EACH.
      #
      # Everything above this line, and install/test/run-workbench.sh below it,
      # boots ONE card: the a2065.  The other eight drivers this project
      # supports had only ever been run by hand, in a throwaway tree, and
      # x-surf-100 reached a user broken because of it.
      #
      # Nine guests, so it is the longest step in the file -- see the wall_s
      # column it prints.  It is here rather than in ci.yml for that reason and
      # because it needs a bridged NIC and a peer, neither of which a hosted
      # runner has.  Skipped, loudly and per card, where the peer is not set.
      - name: Every network card carries bytes both ways
        if: env.AMINETXDUO_A2065 != '' && env.AMINETXDUO_CARDSWEEP_PEER != ''
        run: tools/ci.sh cards

      # THE TWO REGRESSION TESTS THAT NEEDED A REAL LINK AND SO HAD NO HOME.
      #
      # NetShutdown against live services -- httpd serving, nc listening, two
      # holders inside and outside WaitSelect() -- is the regression test for a
      # defect a USER reported: our shutdown took the interfaces down and left
      # every program holding a library whose network had gone.  The TCP: half
      # runs Commodore's own Type and Copy over a socket, which is the only
      # place in the tree that a stock command touches the stack at all.
      #
      # Both were written, both went green by hand, and nothing ran either of
      # them again.  The TCP: half is skipped, loudly, where there is no peer.
      - name: "NetShutdown and the TCP: handler"
        if: env.AMINETXDUO_A2065 != ''
        run: tools/ci.sh bridged

      # THE ONLY RIG THAT CAN PRICE AN ACK OR RETRANSMIT CHANGE.
      #
      # Every other arm here measures a link that loses nothing, so a change to
      # acknowledgement or retransmission behaviour is free on all of them --
      # and 0.16.6 shipped two, with the read direction down 18% on real
      # hardware while every arm we ran said the opposite.  netem on the peer is
      # what gives such a change a price, and the medians are gated against
      # tests/perf/lossgate-baseline.txt.
      #
      # It changes the PEER's root qdisc for the duration, so the peer must be
      # idle; the harness refuses to start otherwise.
      - name: Throughput on a link that loses packets
        if: >
          env.AMINETXDUO_A2065 != '' && env.AMINETXDUO_FITZ_PEER != '' &&
          env.AMINETXDUO_FITZ_PEER_ADDR != ''
        run: tools/ci.sh lossgate

      # SMB, WHICH HAD NO COVERAGE AT ALL.
      #
      # GitHub #3 ("opening SMB2 to the LAN never responds") and #4 ("mounting
      # SMB freezes system") were both unreproducible for a day, because
      # nothing here had ever mounted a share over this stack.  Neither is
      # reachable from a socket test: `nc` connects to 445 from a booted A1200
      # perfectly well, so whatever fails happens above the handshake, inside
      # smb2-handler, and only a machine that can Mount can show it.
      #
      # A real Workbench, Commodore's Mount, and a share the harness stands up
      # itself on the peer -- not one that happens to be running on the LAN,
      # which is a test whose result depends on somebody else's uptime.
      - name: Mount an SMB share on a real Workbench
        if: >
          env.AMINETXDUO_A2065 != '' && env.AMINETXDUO_ADF_DIR != '' &&
          env.AMINETXDUO_SMB2FS != '' && env.AMINETXDUO_FILESYSBOX != '' &&
          env.AMINETXDUO_PEER != ''
        run: tools/ci.sh smb

      # THE ONE THAT WOULD HAVE STOPPED 0.17.0 AND 0.17.1 SHIPPING.
      #
      # Everything above runs a test program on a bare directory drive.  This
      # installs the release archive on a real Workbench 3.1 through Commodore's
      # Installer, power cycles, and lets the stock Startup-Sequence reach
      # S:User-Startup on its own -- which is where those two releases stopped,
      # deadlocked in bsd_address_changed() the moment a DHCP lease arrived.
      # Tier 2 was green throughout: none of it opens bsdsocket.library against
      # a real SANA-II driver and lets DHCP run.
      #
      # Runs on tags, where a release is being cut, and on demand.  Needs the
      # ADFs and the Installer, so it is skipped rather than failed where they
      # are not configured; the tier report below says which tiers ran.
      - name: Release archive on a real Workbench 3.1
        if: env.AMINETXDUO_ADF_DIR != '' && env.AMINETXDUO_INSTALLER != ''
        run: |
          for d in cm:68020 cm-68000:68000 cm-68060:68060; do
            cmake -S . -B "build/${d%%:*}" \
                  -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-m68k-amigaos.cmake \
                  -DCMAKE_BUILD_TYPE=Release -DAMINETXDUO_CPU="${d##*:}"
            cmake --build "build/${d%%:*}" --parallel
          done
          cmake -S . -B build/cm-68000-minimal \
                -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-m68k-amigaos.cmake \
                -DCMAKE_BUILD_TYPE=Release -DAMINETXDUO_CPU=68000 \
                -DAMINETXDUO_IPV6=OFF -DAMINETXDUO_MDNS=OFF -DAMINETXDUO_BPF=OFF \
                -DAMINETXDUO_TLS=OFF -DAMINETXDUO_MULTICAST=OFF \
                -DAMINETXDUO_AREXX=OFF -DAMINETXDUO_TCPDEVICE=OFF
          cmake --build build/cm-68000-minimal --parallel
          dist/make-dist.sh

          # -H IS THE HALF THIS STEP CLAIMS TO DO.  Without it TERMINAL stays 0
          # (install/test/run-workbench.sh:144) and the whole block at :1000
          # to :1223 is skipped: no peer is contacted, tests/tools/httpd-drill.py's
          # twelve WebDAV assertions do not run, wsterm-console.py does not run,
          # the PUT/GET round trip does not run, `lha x` on the Amiga does not
          # run, and the second and third installs -- install-over-existing, and
          # answering the terminal question no -- do not happen at all.  What
          # ran instead was one install, a boot, and a check that some files
          # exist.  tools/ci.sh's e2e stage passes -H and no workflow invokes
          # that stage, so those assertions have never run in CI.
          #
          # It needs a second machine: the host running amiberry cannot reach
          # its own guest.  Where AMINETXDUO_PEER is not configured the step
          # runs without -H and SAYS SO, rather than reporting a quarter of
          # the test as the whole of it.
          archive="$PWD/$(ls -t build/dist/*.lha | head -1)"
          if [ -n "${AMINETXDUO_PEER:-}" ]; then
            echo "e2e_terminal=on peer=$AMINETXDUO_PEER"
            install/test/run-workbench.sh -H -a "$archive"
          else
            echo "e2e_terminal=off"
            echo "::warning::AMINETXDUO_PEER is not set on this runner, so the" \
                 "release e2e ran WITHOUT -H: the WebDAV drill, the browser" \
                 "terminal, lha x on the Amiga and the two reinstall passes" \
                 "were all skipped. Set the AMINETXDUO_PEER repository" \
                 "variable to an ssh target that can reach the guest."
            install/test/run-workbench.sh -a "$archive"
          fi

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # amiberry-run.sh writes build/amiberry-testhd-<tag>/, not
          # build/testhd-<tag>/, so the conformance TAP log was never
          # collected -- which mattered while run-fsuae.sh exited 0 on every
          # run and grading it by hand was the only way to see a failure.
          name: emulator-logs-kickstart
          path: |
            build/ci/emu-*.log
            build/serial*.log
            build/amiberry-testhd-*/bsdsocktest.log
            build/amiberry-testhd-*/conf-out.txt
            build/cardsweep-results.txt
            build/cardsweep-logs/*.log
            build/lossgate-*/median.txt
            build/lossgate-*/samples.txt
            build/smb-*-serial.log
            build/smbhd-*/smbcheck.txt
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------------------
  # Say, in the run summary, which tiers actually ran.  A tier that silently
  # does not run is worse than one that fails.
  # ------------------------------------------------------------------------
  gate:
    name: tier report
    runs-on: ubuntu-latest
    needs: [kickstart]
    if: always()
    steps:
      - name: Report
        run: |
          {
            echo "## Emulator tiers"
            echo
            echo "| tier | ROM | result |"
            echo "|---|---|---|"
            echo "| Kickstart 3.1 | self-hosted only | ${{ needs.kickstart.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.kickstart.result }}" = "skipped" ]; then
            echo "::warning::The Kickstart 3.1 tier did NOT run. The SANA-II" \
                 "network tests and the bsdsocktest conformance suite are" \
                 "therefore unverified for this commit. Set the repository" \
                 "variable AMINETXDUO_KICKSTART_RUNNER to a self-hosted runner" \
                 "label to enable it."
            {
              echo
              echo "> **The Kickstart tier did not run.** The SANA-II network"
              echo "> tests and the conformance suite are unverified for this"
              echo "> commit."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

