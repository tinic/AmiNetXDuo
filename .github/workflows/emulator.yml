# Tier 2 -- the on-Amiga tests, which need an emulator and a boot ROM.
#
# This is a SEPARATE workflow from ci.yml on purpose.  Tier 1 going green must
# never be mistaken for "the stack still works on a 68020"; those are different
# claims and they get different ticks.
#
# TWO ROMS, TWO JOBS
#
#   `kickstart` a real Kickstart 3.1 ROM plus Commodore's a2065.device.  Both
#               are copyrighted and neither may be redistributed, so this job
#               only runs on a self-hosted runner that already has them.  It is
#               the only tier that can run the SANA-II network tests and the
#               bsdsocktest conformance suite, because those need a driver.
#
# SPDX-License-Identifier: MIT

name: Emulator

# Read-only: this tier boots an emulator and reports. It publishes nothing.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      run_kickstart:
        description: "Also run the Kickstart/self-hosted tier"
        type: boolean
        default: false
  schedule:
    # Nightly.
    - cron: "17 4 * * *"
  # Deliberately NOT on push. This tier boots an emulator and takes 7-20
  # minutes, so on an active day it is cancelled by the next push before it
  # finishes and reports nothing useful either way -- while still emailing on
  # every failure. Nightly plus on-demand gives the same coverage without the
  # noise, and tier 1 (ci.yml) still runs on every push.
  push:
    tags: ["v*"]

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ------------------------------------------------------------------------
  kickstart:
    name: FS-UAE on Kickstart 3.1 (self-hosted)
    if: >
      vars.AMINETXDUO_KICKSTART_RUNNER != '' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_kickstart)
    runs-on: ${{ vars.AMINETXDUO_KICKSTART_RUNNER }}
    env:
      # Set these on the runner, or as repository variables.  They are PATHS
      # on that machine -- nothing copyrighted is ever uploaded to GitHub.
      AMINETXDUO_KICKSTART: ${{ vars.AMINETXDUO_KICKSTART }}
      AMINETXDUO_A2065: ${{ vars.AMINETXDUO_A2065 }}
      # The 68000 arm boots an A600, which an A1200 ROM will not start.
      AMINETXDUO_KICKSTART_A600: ${{ vars.AMINETXDUO_KICKSTART_A600 }}
      # install/test/run-workbench.sh: the Workbench 3.1 disks and Commodore's
      # Installer, neither of which is ours to ship.
      AMINETXDUO_ADF_DIR: ${{ vars.AMINETXDUO_ADF_DIR }}
      AMINETXDUO_INSTALLER: ${{ vars.AMINETXDUO_INSTALLER }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check the ROM is really there
        run: |
          if [ ! -f "$AMINETXDUO_KICKSTART" ]; then
            echo "::error::AMINETXDUO_KICKSTART is set to '$AMINETXDUO_KICKSTART'," \
                 "which does not exist on this runner. Refusing to fall back to" \
                 "happened."
            exit 1
          fi

      - name: Build the default and 68000 configurations
        run: AMINETXDUO_CI_CROSS="default m68000" tools/ci.sh cross

      - name: Run the on-Amiga harnesses
        run: tools/ci.sh emulator

      # a2065.device is what the network and conformance tiers need, and it
      # exists only here.
      - name: Conformance suite
        if: env.AMINETXDUO_A2065 != ''
        run: |
          tests/conformance/build.sh
          tests/conformance/run-fsuae.sh -b build/ci/default -a "LOOPBACK NOPAGE"

      # 129 checks over the whole RFC 3542 surface -- IPV6_RECVPKTINFO and
      # IP_PKTINFO arriving together on one datagram, both hop-limit paths read
      # off the wire, the arrival index through if_indextoname() and back. It
      # ran green by hand from the day it was written and nothing re-ran it,
      # which is the state every regression starts in.
      #
      # NOT gated on AMINETXDUO_A2065, unlike the conformance step above: the
      # test installs its own SANA-II device (tests/tcpdrill/tapdev.c) before it
      # opens the library, so it needs no driver anyone has to supply. A ROM is
      # the whole requirement.
      #
      # -A because this runner is headless and FS-UAE dies in GLAD before the
      # guest boots. The results are on the SERIAL log, not the guest's
      # stdout.txt -- the harness prints the verdict either way.
      - name: IPv6 socket surface
        run: tests/ipv6/run-socket-fsuae.sh -A -b build/ci/default

      # The same regression, one tier down and in a minute rather than ten.
      # A bare drive shows it as an interface that comes up with no address,
      # where a real Workbench shows it as a machine that stops booting; the
      # cause is one thing, the IP thread blocked on sb_Lock so the lease never
      # completes.  Needs a driver, hence the A2065 gate.
      - name: AddNetInterface comes back
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tools/run-addifup.sh -b build/ci/default

      # The commands that change the machine's network configuration, each
      # over its own whole surface: the interface switched down and up and
      # asserted with a ping in every state, the configuration file written
      # and read back off the drive, the mDNS browse and its window. All four
      # are SLIRP, so they need the driver and no peer, and none takes longer
      # than half a minute.
      #
      # RemoveNetInterface shipped in 0.20.0 broken in the one thing its own
      # header promised, because a compile was all that ever ran over it.
      # These are here so the same cannot happen quietly again.
      - name: RemoveNetInterface frees its slot
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tools/run-ifremove.sh -b build/ci/default

      - name: Online and Offline
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tools/run-onoff.sh -b build/ci/default

      # ConfigureNetInterface changes the three numbers on an interface that
      # stays where it is.  The counter assertion is the one that matters: a
      # command that quietly fell back to a remove and an add would pass every
      # assertion about the address and fail that one.
      - name: ConfigureNetInterface changes an interface in place
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tools/run-ifconfigure.sh -b build/ci/default

      # The DHCP half of the same command, which needs a server and so an
      # interface with a second writer.  A separate file for that reason, not
      # because it is a separate command.
      - name: ConfigureNetInterface releases and renews a lease
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tools/run-ifdhcp.sh -b build/ci/default

      - name: NetSetup writes a usable configuration
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tools/run-netsetup.sh -b build/ci/default

      - name: ShowNetServices and its window
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tools/run-shownetservices.sh -b build/ci/default

      # A TLS 1.3 handshake end to end, against a peer that will not fall
      # back to 1.2, on both tiers -- and the second one is not redundant.
      # A 68020 takes the hand-written limb primitives in c68k_prim.S; a
      # 68060 cannot, because MULU.L's 32x32 -> 64 form was dropped from
      # that part, so it runs the portable C instead. The carry-in bug that
      # stopped 68060 TLS 1.3 was in that C and a green 68020 run said
      # nothing about it. Two arms, two code paths.
      - name: TLS 1.3 handshake, 68020
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tls/run-tls13.sh -b build/ci/default -c 68020

      - name: TLS 1.3 handshake, 68060
        if: env.AMINETXDUO_A2065 != ''
        run: tests/tls/run-tls13.sh -b build/ci/default -c 68060

      # THE ONE THAT WOULD HAVE STOPPED 0.17.0 AND 0.17.1 SHIPPING.
      #
      # Everything above runs a test program on a bare directory drive.  This
      # installs the release archive on a real Workbench 3.1 through Commodore's
      # Installer, power cycles, and lets the stock Startup-Sequence reach
      # S:User-Startup on its own -- which is where those two releases stopped,
      # deadlocked in bsd_address_changed() the moment a DHCP lease arrived.
      # Tier 2 was green throughout: none of it opens bsdsocket.library against
      # a real SANA-II driver and lets DHCP run.
      #
      # Runs on tags, where a release is being cut, and on demand.  Needs the
      # ADFs and the Installer, so it is skipped rather than failed where they
      # are not configured; the tier report below says which tiers ran.
      - name: Release archive on a real Workbench 3.1
        if: env.AMINETXDUO_ADF_DIR != '' && env.AMINETXDUO_INSTALLER != ''
        run: |
          for d in cm:68020 cm-68000:68000 cm-68060:68060; do
            cmake -S . -B "build/${d%%:*}" \
                  -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-m68k-amigaos.cmake \
                  -DCMAKE_BUILD_TYPE=Release -DAMINETXDUO_CPU="${d##*:}"
            cmake --build "build/${d%%:*}" --parallel
          done
          cmake -S . -B build/cm-68000-minimal \
                -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-m68k-amigaos.cmake \
                -DCMAKE_BUILD_TYPE=Release -DAMINETXDUO_CPU=68000 \
                -DAMINETXDUO_IPV6=OFF -DAMINETXDUO_MDNS=OFF -DAMINETXDUO_BPF=OFF \
                -DAMINETXDUO_TLS=OFF -DAMINETXDUO_MULTICAST=OFF \
                -DAMINETXDUO_AREXX=OFF -DAMINETXDUO_TCPDEVICE=OFF
          cmake --build build/cm-68000-minimal --parallel
          dist/make-dist.sh
          install/test/run-workbench.sh -a "$PWD/$(ls -t build/dist/*.lha | head -1)"

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs-kickstart
          path: |
            build/ci/emu-*.log
            build/serial*.log
            build/testhd-conformance/bsdsocktest.log
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------------------
  # Say, in the run summary, which tiers actually ran.  A tier that silently
  # does not run is worse than one that fails.
  # ------------------------------------------------------------------------
  gate:
    name: tier report
    runs-on: ubuntu-latest
    needs: [kickstart]
    if: always()
    steps:
      - name: Report
        run: |
          {
            echo "## Emulator tiers"
            echo
            echo "| tier | ROM | result |"
            echo "|---|---|---|"
            echo "| Kickstart 3.1 | self-hosted only | ${{ needs.kickstart.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.kickstart.result }}" = "skipped" ]; then
            echo "::warning::The Kickstart 3.1 tier did NOT run. The SANA-II" \
                 "network tests and the bsdsocktest conformance suite are" \
                 "therefore unverified for this commit. Set the repository" \
                 "variable AMINETXDUO_KICKSTART_RUNNER to a self-hosted runner" \
                 "label to enable it."
            {
              echo
              echo "> **The Kickstart tier did not run.** The SANA-II network"
              echo "> tests and the conformance suite are unverified for this"
              echo "> commit."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

