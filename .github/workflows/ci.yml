# Tier 1 -- everything that needs no emulator and no licensed material.
#
# This runs on a clean checkout of any machine: the m68k toolchain comes from
# our own release asset, pinned by sha256, with the upstream registry as a
# fallback (tools/fetch-toolchain.sh), and every step is `tools/ci.sh <stage>`,
# so build and host-test stages use the same code locally and in CI. The
# full-history gitlink job below is the exception: it supplies remote history
# that a shallow checkout cannot have, then runs the same local checker.
#
# The emulator tier lives in emulator.yml, deliberately separate: a green tick
# here must never be read as "the on-Amiga tests passed".
#
# SPDX-License-Identifier: MIT

name: CI

permissions:
  contents: read
  actions: read

on:
  push:
    # Branch pushes are covered by PR validation. Main still gets fresh
    # shipping checks/artifacts; only proven identical-tree matrices reuse.
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly full option coverage, rather than every tool/UI/test-only edit.
    - cron: '23 8 * * 1'

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # One cheap job always runs, including for prose-only commits.  It also
  # derives the option matrix from tools/ci.sh, so the workflow cannot carry
  # a stale hand-written copy.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.changes.outputs.mode }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      options: ${{ steps.options.outputs.options }}
      reuse_run: ${{ steps.options.outputs.reuse_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the change
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: tools/ci-plan.sh "$BASE_SHA" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" | tee -a "$GITHUB_OUTPUT"

      - name: Select option coverage
        id: options
        env:
          MODE: ${{ steps.changes.outputs.mode }}
          BASE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$MODE" != full ]; then
            echo 'options=skipped' >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            tools/ci-matrix-reuse.sh "$BASE_SHA" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
          else
            echo 'options=build' >> "$GITHUB_OUTPUT"
          fi

      - name: Derive the option matrix
        id: matrix
        run: |
          matrix=$(tools/ci.sh --list-cross | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "mode=${{ steps.changes.outputs.mode }} options=${{ steps.options.outputs.options }} reused_run=${{ steps.options.outputs.reuse_run }} matrix=$matrix" >> "$GITHUB_STEP_SUMMARY"

  # actions/checkout leaves submodules shallow even with fetch-depth: 0 on
  # the superproject. The usual ci.sh check can then only say
  # pin=shallow_unchecked, so one job must fetch the full histories and make
  # a topic-branch gitlink a fatal required-check failure.
  gitlinks:
    name: gitlink ancestry
    needs: plan
    if: needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'shipping'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch submodule histories and tags
        run: |
          # The single quotes defer expansion to each submodule's shell.
          # shellcheck disable=SC2016
          git submodule foreach '
            set -e
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --unshallow --tags origin "+refs/heads/*:refs/remotes/origin/*"
            else
              git fetch --tags origin "+refs/heads/*:refs/remotes/origin/*"
            fi
            git remote set-head origin -a
          '

      - name: Check every gitlink against full history
        run: AMINETXDUO_GITLINKS_REQUIRE_FULL=1 tools/check-gitlinks.sh

  # -fanalyzer over the tree, beside the rest rather than in front of it.
  analyze:
    name: static analysis
    needs: plan
    if: needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'shipping'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up the toolchain and compiler cache
        uses: ./.github/actions/setup-amiga
        with:
          cache-profile: analyze

      - name: tools/ci.sh analyze
        run: AMINETXDUO_ANALYZE=1 tools/ci.sh analyze

  # Every option arm, one runner each.  Keep one explicit no-build verdict
  # when the matrix is omitted: a skipped matrix job can prevent GitHub from
  # scheduling the dependent tier 1 report at all.
  options:
    name: "cross: ${{ matrix.config }}"
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.plan.outputs.mode == 'full' && needs.plan.outputs.options == 'build' && needs.plan.outputs.matrix || '["__skipped__"]') }}
    steps:
      - name: No optional builds selected
        if: matrix.config == '__skipped__'
        env:
          OPTION_PLAN: ${{ needs.plan.outputs.options }}
        run: |
          [ "$OPTION_PLAN" != build ] || {
            echo 'option_matrix=FAIL planned builds produced no matrix' >&2
            exit 1
          }
          echo 'option_matrix=skipped' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: matrix.config != '__skipped__'
        with:
          submodules: recursive

      - name: Set up the toolchain and compiler cache
        if: matrix.config != '__skipped__'
        uses: ./.github/actions/setup-amiga
        with:
          cache-profile: cross-${{ matrix.config }}

      - name: Build it
        if: matrix.config != '__skipped__'
        run: AMINETXDUO_CI_CROSS="${{ matrix.config }}" tools/ci.sh cross

  # stage_cross used to build this once per matrix arm.  It is invariant with
  # respect to those arms and takes about 77 seconds, so run exactly one copy.
  stackframes:
    name: stack-frame budget
    needs: plan
    if: needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'shipping'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up the toolchain and compiler cache
        uses: ./.github/actions/setup-amiga
        with:
          cache-profile: stackframes

      - name: Check stack frames
        run: tools/ci.sh stackframes

  # ------------------------------------------------------------------------
  # Host tests + every cross configuration in tools/ci.sh's CROSS_CONFIGS +
  # the conformance suite build.  The count lives there, not here.
  # ------------------------------------------------------------------------
  tier1:
    name: build + host tests
    needs: plan
    if: needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'shipping'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Named before anything is built.  tools/version.sh reads the project()
      # line and the submodule headers, so a workflow can label its own output
      # without configuring cmake and without running an m68k binary -- and it
      # exits nonzero if third_party/ has moved away from the recorded NetX
      # Duo or ThreadX version, which makes a stale artefact name a red build
      # rather than a wrong label.
      - name: Derive the version
        run: |
          tools/version.sh --env >> "$GITHUB_ENV"
          echo "### $(tools/version.sh --long)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up the toolchain and compiler cache
        uses: ./.github/actions/setup-amiga
        with:
          cache-profile: tier1

      - name: Report the toolchain
        run: |
          . tools/amiga-toolchain.sh
          echo "AMIGA_TOOLCHAIN_ROOT=$AMIGA_TOOLCHAIN_ROOT" >> "$GITHUB_ENV"
          "$AMIGA_GCC" --version | head -1

      # gcc-multilib is for the host32 stage alone: the mDNS fuzz driver only
      # runs where sizeof(void*) == 4. Without it that stage skips itself and
      # the parser goes untested, which is a silent gap rather than a red build.
      - name: 32-bit host libraries
        run: |
          # A VENDOR'S BROKEN INDEX MUST NOT REDDEN THIS REPO.  On 2026-09-09
          # dl.google.com's chrome-stable index served a Hash Sum mismatch,
          # and `apt-get update` exits non-zero on ANY source it could not
          # read, so this job and `shell scripts` both failed before a line of
          # this tree was compiled -- twice, on a commit whose own gates were
          # green.  Nothing here wants Chrome.
          #
          # ONLY GOOGLE'S, and that precision is the whole lesson: the first
          # attempt removed *.list AND *.sources, which on this image takes
          # UBUNTU'S OWN repositories with it -- they live in
          # /etc/apt/sources.list.d/ubuntu.sources in deb822 format, not in
          # /etc/apt/sources.list -- and the step then failed with
          # "Package 'gcc-multilib' has no installation candidate".
          sudo rm -f /etc/apt/sources.list.d/*google*.list \
                     /etc/apt/sources.list.d/*google*.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib

      # THE OPTION ARMS RUN IN PARALLEL, in the `options` job below.  Twelve
      # cross builds at ~82 s each on a hosted runner was fifteen minutes of a
      # twenty-two minute run, all of it serial and none of it needed by
      # anything later in this job except `default`, which conformance wants.
      # The coverage is unchanged; only the shape is.
      # analyze is its own job below: 2 m 34 s of -fanalyzer on the critical
      # path of a run with a ten-minute ceiling, and it gates nothing here.
      - name: tools/ci.sh
        run: >-
          AMINETXDUO_SANITIZE=1 AMINETXDUO_CI_CROSS="default"
          tools/ci.sh host host32 sanitize clientshims cross web conformance
          survey

      # The logs are where a failure is diagnosed, and they are the only thing
      # that survives the runner.
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/ci/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the m68k artefacts
        uses: actions/upload-artifact@v4
        with:
          # Versioned: a downloaded artefact has to be able to say what it is
          # without being unpacked and run on an Amiga.  Product version plus
          # the NetX Duo it was built against, exactly as the .lha reports it.
          name: aminetxduo-m68k-${{ env.AMINETXDUO_VERSION_COMPOUND }}
          path: |
            build/ci/default/src/bsdsocket/bsdsocket.library
            build/ci/default/src/usergroup/usergroup.library
            build/ci/default/src/tools/*
            build/bsdsocktest/bsdsocktest
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------------
  # The host tier again, on macOS/clang.  Cheap (no cross toolchain, no
  # submodule-heavy build) and it is the only thing that stops the host-side
  # parser/VM/vector tests becoming GCC-only.
  # ------------------------------------------------------------------------
  host-clang:
    name: host tests (macOS / clang)
    needs: plan
    if: needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'shipping'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # `survey` here too, and deliberately: its generators are python and
      # shell, and the one macOS defect they have already had was `wc -l`
      # padding its output so a `[ "$got" = "2" ]` compared "       2".  A
      # portability trap in a gate is only found by running the gate on the
      # other platform.
      - name: tools/ci.sh host
        run: AMINETXDUO_SANITIZE=1 tools/ci.sh host sanitize survey

  # ------------------------------------------------------------------------
  # Cheap hygiene that would otherwise only be caught by a human.
  # ------------------------------------------------------------------------
  shellcheck:
    name: shell scripts
    needs: plan
    if: needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'shipping'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          # Same reason as the 32-bit libraries step above, and the same
          # precision: Google's sources only, because Ubuntu's own live in
          # that directory too.
          sudo rm -f /etc/apt/sources.list.d/*google*.list \
                     /etc/apt/sources.list.d/*google*.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # -S warning: style and info notes are not worth a red build.
          # -e SC1091: the sourced toolchain resolver is found at run time.
          shellcheck -S warning -e SC1091 \
            tools/ci.sh \
            tools/ci-plan.sh \
            tools/ci-matrix-reuse.sh \
            tools/ci-policy-selftest.sh \
            tools/check-ci-success.sh \
            tools/check-ci-success-selftest.sh \
            tools/check-submodule-delta.sh \
            tools/check-submodule-delta-selftest.sh \
            tools/check-gitlinks-selftest.sh \
            tools/check-release-candidate.sh \
            tools/build-release.sh \
            tools/stage-developer.sh \
            tools/check-release-ready.sh \
            tools/upstream-drift.sh \
            tools/analyze.sh \
            tools/cppcheck.sh \
            tools/version.sh \
            tools/fetch-toolchain.sh \
            tools/build-toolchain.sh \
            tools/package-toolchain-mirror.sh \
            tools/amiga-toolchain.sh \
            tools/toolchain-resolve-selftest.sh \
            tools/classicwb-serve-selftest.sh \
            tools/amiberry-run.sh \
            tools/bridge-lock-selftest.sh \
            tools/classicwb.sh \
            tools/logcap.sh \
            tools/enforcer-run.sh \
            tools/ci-arm.sh \
            tools/check-client-shims.sh \
            clients/amiga-client.sh \
            clients/dropbear/build.sh \
            clients/dropbear/run-dbclient.sh \
            clients/dropbear/run-scp.sh \
            clients/dropbear/sshd-testserver.sh \
            clients/dropbear/tweetnacl-count.sh \
            tests/conformance/build.sh \
            tests/conformance/run-conformance.sh \
            tests/tools/run-iperf.sh \
            tests/tools/run-arpretry.sh \
            tests/tools/run-rpcprobe.sh \
            tests/tools/run-cardsweep.sh \
            tests/tools/cards.sh \
            tests/tools/run-cpuspeed.sh \
            tests/tools/run-bigmem.sh \
            tests/tools/run-multidef.sh \
            tests/tools/run-bringupfail.sh \
            tests/tools/bringup-verdict.sh \
            tests/tools/bringup-verdict-selftest.sh \
            tests/tools/bringupfail-verdict.sh \
            tests/tools/bringupfail-verdict-selftest.sh \
            tests/tools/check-no-log-advice.sh \
            tests/tools/peersender-selftest.sh \
            tests/tools/run-cardsweep6.sh \
            tools/emu-mac.sh \
            tools/emu-board.sh \
            tools/sana2-stage.sh \
            install/test/run-workbench.sh \
            tools/aminet-batch.sh \
            tools/check-generated.sh \
            tools/check-lvo-matrix.sh \
            tools/check-lvo-clobbers.sh \
            tools/check-call-abi.sh \
            tools/check-option-stubs.sh \
            tools/check-gitlinks.sh \
            tools/check-test-duration.sh \
            tools/tree-stamp.sh \
            tools/check-nx-status.sh \
            tools/nx-discard-scan.sh \
            tools/check-slot-clear.sh \
            install/test/run-workbench-cards.sh

  package:
    name: release candidate
    needs: plan
    if: needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'shipping'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Derive the version
        run: tools/version.sh --env >> "$GITHUB_ENV"

      - name: Set up the toolchain and compiler cache
        uses: ./.github/actions/setup-amiga
        with:
          cache-profile: release-shipping

      - name: Install the archive writer
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google*.list \
                     /etc/apt/sources.list.d/*google*.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq jlha-utils

      - name: Build and verify the candidate
        run: tools/build-release.sh

      - name: Upload the immutable candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            build/dist/*.lha
            build/dist/release-candidate.txt
          if-no-files-found: error
          # Nightly installer E2E consumes this same candidate.  Keep enough
          # history for a quiet main branch without rebuilding on that runner.
          retention-days: 90
          compression-level: 0

  docs:
    name: documentation gates
    needs: plan
    if: needs.plan.outputs.mode == 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check documentation and derived survey tables
        run: |
          tools/check-doc-budget.sh
          tools/check-changelog-prose.sh
          tools/ci.sh survey

  # Stable required check: shipping keeps every gate except optional builds.
  # Reused matrix proof is reported explicitly, not relabelled as execution.
  gate:
    name: tier 1 report
    if: always()
    needs: [plan, gitlinks, analyze, options, stackframes, tier1, host-clang, shellcheck, package, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Report
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          PLAN: ${{ needs.plan.result }}
          GITLINKS: ${{ needs.gitlinks.result }}
          ANALYZE: ${{ needs.analyze.result }}
          OPTIONS: ${{ needs.options.result }}
          OPTION_PLAN: ${{ needs.plan.outputs.options }}
          REUSE_RUN: ${{ needs.plan.outputs.reuse_run }}
          STACKFRAMES: ${{ needs.stackframes.result }}
          TIER1: ${{ needs.tier1.result }}
          HOST_CLANG: ${{ needs.host-clang.result }}
          SHELLCHECK: ${{ needs.shellcheck.result }}
          PACKAGE: ${{ needs.package.result }}
          DOCS: ${{ needs.docs.result }}
        run: |
          echo "option_plan=$OPTION_PLAN reuse_run=$REUSE_RUN"
          printf 'mode=%s plan=%s gitlinks=%s analyze=%s options=%s stackframes=%s tier1=%s host_clang=%s shellcheck=%s package=%s docs=%s\n' \
            "$MODE" "$PLAN" "$GITLINKS" "$ANALYZE" "$OPTIONS" "$STACKFRAMES" \
            "$TIER1" "$HOST_CLANG" "$SHELLCHECK" "$PACKAGE" "$DOCS"
          [ "$PLAN" = success ] || exit 1
          case "$MODE" in
            full|shipping)
              case "$MODE:$OPTION_PLAN:$OPTIONS" in
                full:build:success|shipping:skipped:success) ;;
                full:reused:success)
                  case "$REUSE_RUN" in ''|*[!0-9]*) exit 1 ;; esac
                  echo "option_matrix=reused source_run=$REUSE_RUN" ;;
                *) echo "unexpected option coverage: $MODE:$OPTION_PLAN:$OPTIONS" >&2; exit 1 ;;
              esac
              [ "$GITLINKS" = success ] && [ "$ANALYZE" = success ] &&
              [ "$STACKFRAMES" = success ] && [ "$TIER1" = success ] &&
              [ "$HOST_CLANG" = success ] && [ "$SHELLCHECK" = success ] &&
              [ "$PACKAGE" = success ] &&
              [ "$DOCS" = skipped ]
              ;;
            docs)
              [ "$OPTION_PLAN" = skipped ] && [ "$DOCS" = success ] && [ "$GITLINKS" = skipped ] && [ "$ANALYZE" = skipped ] &&
              [ "$OPTIONS" = success ] && [ "$STACKFRAMES" = skipped ] &&
              [ "$TIER1" = skipped ] && [ "$HOST_CLANG" = skipped ] &&
              [ "$SHELLCHECK" = skipped ] && [ "$PACKAGE" = skipped ]
              ;;
            *) echo "unknown CI mode: $MODE" >&2; exit 1 ;;
          esac

      # Only a genuinely executed full matrix earns these markers. Shipping
      # and reused runs remain useful candidates, but cannot authorize release.
      - uses: actions/checkout@v4
        if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.options == 'build' && needs.options.result == 'success'
      - name: Record full coverage identity
        if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.options == 'build' && needs.options.result == 'success'
        id: proof
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\ntree=%s\nrun=%s\n' "$GITHUB_SHA" "$tree" "$GITHUB_RUN_ID" > ci-full-coverage.txt
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.options == 'build' && needs.options.result == 'success'
        with:
          name: ci-options-tree-${{ steps.proof.outputs.tree }}
          path: ci-full-coverage.txt
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.mode == 'full' && needs.plan.outputs.options == 'build' && needs.options.result == 'success'
        with:
          name: ci-full-${{ github.sha }}
          path: ci-full-coverage.txt
          if-no-files-found: error
          retention-days: 90
