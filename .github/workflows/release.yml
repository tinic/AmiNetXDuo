# Promote the immutable release candidate produced by CI for this exact SHA.
# No product source is compiled here: successful CI is the build-and-test
# attestation, and release-candidate.txt binds the downloaded archive and
# update containers to their commit and digest.  A tag therefore cannot
# publish convenient-but-different bytes.  The one thing built here is
# updverify, the host build of the updater's signature and manifest check.
#
# THE UPDATE RELEASE (#497), on a v* tag only:
#
#   prev     self-hosted: certificates.prev from the channel's published,
#            signed manifest on the mirror (tools/update-certificates-prev.sh)
#   sign     GitHub-hosted, environment `release`: the CI candidate's
#            update.manifest with that line, signed with the environment
#            secret AMINETXDUO_UPDATE_SIGNING_KEY, checked by updverify
#   publish  self-hosted, environment `release`: checked again, uploaded to
#            the mirror's channel folder and switched in atomically
#   github   the GitHub release: the archive, update.manifest and its .sig
#
# The channel is prerelease for a tag with a "-" (v1.0.0-rc5) and release
# otherwise, the rule the GitHub release's --prerelease uses.  The secret and
# the mirror upload key never reach a pull request: this workflow runs on
# tag pushes and dispatch only, and the environment `release` admits v* tags
# only, with turo as required reviewer.
#
# SPDX-License-Identifier: MIT

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: exact-SHA CI verdict
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.ci.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check the tag against the tree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want=$(tools/version.sh --tag)
          got=${GITHUB_REF#refs/tags/}
          [ "$want" = "$got" ] || {
            echo "::error::tag $got does not match the tree, which says $want"
            exit 1
          }

      - name: Require successful CI for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verdict=$(tools/check-ci-success.sh "$GITHUB_SHA" 1200)
          echo "$verdict"
          run_id=$(printf '%s\n' "$verdict" | sed -n 's/.* run=\([0-9][0-9]*\) .*/\1/p')
          [ -n "$run_id" ] || { echo "::error::CI verdict carried no run id"; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      # Every submodule commit added or dropped since the previous v* tag is
      # listed with a reviewer in tools/release/submodules-<tag>.txt.  The
      # script fetches any submodule objects the checkout lacks.
      - name: Submodule delta since the previous release is reviewed
        if: startsWith(github.ref, 'refs/tags/')
        run: tools/check-submodule-delta.sh --tag "$(tools/version.sh --tag)" "$GITHUB_SHA"

      - name: CHANGELOG.md carries facts, not prose
        run: tools/check-changelog-prose.sh

  release:
    name: verify the CI candidate
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      compound: ${{ steps.version.outputs.compound }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Derive the version
        id: version
        run: |
          tools/version.sh --env >> "$GITHUB_ENV"
          echo "compound=$(tools/version.sh --compound)" >> "$GITHUB_OUTPUT"
          echo "### $(tools/version.sh --long)" >> "$GITHUB_STEP_SUMMARY"

      - name: Download the exact CI candidate
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: build/candidate
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify.outputs.run_id }}

      - name: Verify source identity and archive digest
        run: tools/check-release-candidate.sh build/candidate "$GITHUB_SHA"

      # Keep an artifact on this workflow as well, so workflow_dispatch remains
      # a non-publishing exercise of the complete promotion path.
      - name: Upload the verified archive
        uses: actions/upload-artifact@v4
        with:
          name: AmiNetXDuo-${{ env.AMINETXDUO_VERSION_COMPOUND }}
          path: build/candidate/*.lha
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  prev:
    name: certificates.prev from the mirror
    permissions:
      actions: read
      contents: read
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # The mirror is on the lab LAN; this runner reaches it.
    runs-on: [self-hosted, playhouse3]
    outputs:
      certificates_prev: ${{ steps.prev.outputs.certificates_prev }}
      channel: ${{ steps.prev.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: The published manifest of the channel
        id: prev
        run: |
          tag=${GITHUB_REF#refs/tags/}
          channel=release
          case "$tag" in *-*) channel=prerelease ;; esac
          out=$(tools/update-certificates-prev.sh -m "$AMINETXDUO_UPDATE_MIRROR" \
                    -c "$channel" -v "$(tools/version.sh --product)" \
                    -b "$RUNNER_TEMP/updverify")
          echo "$out"
          echo "certificates_prev=$(printf '%s\n' "$out" | sed -n 's/^certificates_prev=\([0-9a-f]\{64\}\) .*/\1/p')" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        env:
          AMINETXDUO_UPDATE_MIRROR: http://aminetxduo.tinic.info/

  sign:
    name: sign the update manifest
    permissions:
      actions: read
      contents: read
    needs: [verify, prev]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download the exact CI candidate
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: build/candidate
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify.outputs.run_id }}

      - name: Verify source identity, digests and the tool's keys
        run: tools/check-release-candidate.sh build/candidate "$GITHUB_SHA"

      - name: Sign
        env:
          AMINETXDUO_UPDATE_SIGNING_KEY: ${{ secrets.AMINETXDUO_UPDATE_SIGNING_KEY }}
          PREV: ${{ needs.prev.outputs.certificates_prev }}
          CHANNEL: ${{ needs.prev.outputs.channel }}
        run: |
          [ "$(sed -n 's/^channel=//p' build/candidate/update/update.manifest)" = "$CHANNEL" ] || {
            echo "::error::the manifest's channel is not $CHANNEL"; exit 1; }
          tools/sign-update-manifest.sh -k rel-2026 -p "$PREV" \
              -o build/signed build/candidate/update

      - name: Check the signature with the updater's code
        run: |
          tools/verify-update-manifest.sh -c "${{ needs.prev.outputs.channel }}" \
              -b "$RUNNER_TEMP/updverify" build/signed

      - name: Keep the signed update
        uses: actions/upload-artifact@v4
        with:
          name: update-signed-${{ github.sha }}
          path: build/signed/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  publish:
    name: publish the update to the mirror
    permissions:
      actions: read
      contents: read
    needs: [prev, sign]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, playhouse3]
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download the signed update
        uses: actions/download-artifact@v4
        with:
          name: update-signed-${{ github.sha }}
          path: build/signed

      - name: Check the signature with the updater's code
        run: |
          tools/verify-update-manifest.sh -c "${{ needs.prev.outputs.channel }}" \
              -b "$RUNNER_TEMP/updverify" build/signed

      - name: Upload and switch the channel folder
        env:
          AMINETXDUO_MIRROR_UPLOAD_HOST: ${{ vars.AMINETXDUO_MIRROR_UPLOAD_HOST }}
          AMINETXDUO_MIRROR_UPLOAD_USER: ${{ vars.AMINETXDUO_MIRROR_UPLOAD_USER }}
          AMINETXDUO_UPDVERIFY_BUILD: ${{ runner.temp }}/updverify
        run: tools/publish-update.sh -c "${{ needs.prev.outputs.channel }}" build/signed

  github:
    name: publish the GitHub release
    needs: [release, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download the exact CI candidate
        uses: actions/download-artifact@v4
        with:
          name: AmiNetXDuo-${{ needs.release.outputs.compound }}
          path: build/candidate

      - name: Download the signed update
        uses: actions/download-artifact@v4
        with:
          name: update-signed-${{ github.sha }}
          path: build/signed

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF#refs/tags/}
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag is already published; leaving it alone"
            exit 0
          fi

          # Download link, the tag's paragraph, the CHANGELOG section folded.
          # The script refuses a tag that does not name this tree and a
          # CHANGELOG.md without the version's section.
          notes=$(mktemp)
          trap 'rm -f "$notes"' EXIT
          # checkout leaves the pushed tag pointing at the commit; fetch the
          # annotated tag object so its paragraph reaches the notes
          git fetch --force origin "+refs/tags/$tag:refs/tags/$tag"
          tools/release-notes.sh "$tag" > "$notes"

          # A tag with a prerelease part, such as v1.0.0-rc4, is a pre-release
          # and never the latest release.
          kind=--latest
          case "$tag" in *-*) kind=--prerelease ;; esac
          gh release create "$tag" "$kind" \
             --title "$(tools/version.sh --long)" \
             --notes-file "$notes" \
             build/candidate/*.lha \
             build/signed/update.manifest \
             build/signed/update.manifest.sig
