# Promote the immutable release candidate produced by CI for this exact SHA.
# No source is compiled here: successful CI is the build-and-test attestation,
# and release-candidate.txt binds the downloaded archive to its commit and
# digest.  A tag therefore cannot publish convenient-but-different bytes.
#
# SPDX-License-Identifier: MIT

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: exact-SHA CI verdict
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.ci.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check the tag against the tree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want=$(tools/version.sh --tag)
          got=${GITHUB_REF#refs/tags/}
          [ "$want" = "$got" ] || {
            echo "::error::tag $got does not match the tree, which says $want"
            exit 1
          }

      - name: Require successful CI for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verdict=$(tools/check-ci-success.sh "$GITHUB_SHA" 1200)
          echo "$verdict"
          run_id=$(printf '%s\n' "$verdict" | sed -n 's/.* run=\([0-9][0-9]*\) .*/\1/p')
          [ -n "$run_id" ] || { echo "::error::CI verdict carried no run id"; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: CHANGELOG.md carries facts, not prose
        run: tools/check-changelog-prose.sh

  release:
    name: publish the CI candidate
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Derive the version
        run: |
          tools/version.sh --env >> "$GITHUB_ENV"
          echo "### $(tools/version.sh --long)" >> "$GITHUB_STEP_SUMMARY"

      - name: Download the exact CI candidate
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: build/candidate
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify.outputs.run_id }}

      - name: Verify source identity and archive digest
        run: tools/check-release-candidate.sh build/candidate "$GITHUB_SHA"

      # Keep an artifact on this workflow as well, so workflow_dispatch remains
      # a non-publishing exercise of the complete promotion path.
      - name: Upload the verified archive
        uses: actions/upload-artifact@v4
        with:
          name: AmiNetXDuo-${{ env.AMINETXDUO_VERSION_COMPOUND }}
          path: build/candidate/*.lha
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF#refs/tags/}
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag is already published; leaving it alone"
            exit 0
          fi

          notes=$(mktemp)
          body=$(mktemp)
          trap 'rm -f "$notes" "$body"' EXIT
          ver=$(tools/version.sh --product)
          awk -v v="## $ver" -v pfx="## ${ver%.*}." '
              $0 == v {found = 1; next}
              found && /^## / && index($0, pfx) != 1 {exit}
              found {print}
          ' CHANGELOG.md > "$body"
          [ -s "$body" ] || {
              echo "::error::CHANGELOG.md has no '## $ver' section"
              exit 1
          }

          {
            echo "$(tools/version.sh --long)"
            echo
            echo "Drop \`AmiNetXDuo-$ver.lha\` on a Workbench window and run \`Install-AmiNetXDuo\`."
            echo
            cat "$body"
          } > "$notes"

          gh release create "$tag" \
             --title "$(tools/version.sh --long)" \
             --notes-file "$notes" \
             build/candidate/*.lha
