# Cut a release: build the .lha and attach it to a GitHub Release.
#
# Triggered by pushing a plain vX.Y.Z tag, which is the only release tag form
# this project uses -- the commit count belongs in a binary's version output
# and nowhere else (tools/version.sh, docs/RESEARCH.md).
#
# The tag is CHECKED against the tree rather than trusted: pushing v0.2.0 at a
# commit whose project() line still says 0.1.0 fails the job instead of
# publishing an archive that misnames itself.  Same reasoning as
# cmake/AmiNetXDuoVersion.cmake refusing to configure when a submodule bump has
# left the recorded NetX Duo version stale.
#
# workflow_dispatch builds the archive and uploads it as a workflow artefact
# WITHOUT creating a release, so the packaging can be exercised without
# publishing anything.
#
# This does not run the emulator tiers -- it cannot, they need a Kickstart ROM.
# A release therefore carries exactly the assurance tier 1 gives it, and the
# release notes say so rather than leaving the reader to assume otherwise.
#
# SPDX-License-Identifier: MIT

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # creating a release and uploading assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # Every configuration the tree offers, one runner each, at the same time as
  # the archive is built rather than in front of it.  Not `needs:` -- a
  # failure here still reddens the run, and gating the archive on it would put
  # these minutes back onto the critical path, which is the whole point.
  options:
    name: "cross: ${{ matrix.config }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [noipv6, nomdns, notls, nomcast, noasm, norxverify,
                 nosack, nots, nowscale, census, minimal]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The same preamble the release job runs, deliberately identical: the
      # cached tree is a REPAIRED tree and the key has to say so, and a warm
      # cache from before a repair must still be checked.  A shorter version
      # here would build these arms on a toolchain the archive is not built
      # with, which is worse than not building them.
      - name: Toolchain pin
        id: pin
        run: echo "sha=$(tools/fetch-toolchain.sh --print-sha)" >> "$GITHUB_OUTPUT"

      - name: Cache the pinned m68k toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/aminetxduo/toolchain
          key: m68k-amigaos-gcc-15.2.0-${{ steps.pin.outputs.sha }}-${{ hashFiles('tools/fix-toolchain-crt0.py', 'tools/fix-toolchain-inline-const.py') }}

      - name: Fetch the toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: tools/fetch-toolchain.sh

      - name: The toolchain's crt0 is repaired
        run: tools/fetch-toolchain.sh --check-crt0

      - name: The toolchain's inline register ABI is repaired
        run: tools/fetch-toolchain.sh --check-inlines

      - name: Build it
        run: AMINETXDUO_CI_CROSS="${{ matrix.config }}" tools/ci.sh cross

  release:
    name: build the distribution archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The release body quotes a commit count, and tools/version.sh
          # --build derives it from history.
          fetch-depth: 0

      - name: Derive the version
        run: |
          tools/version.sh --env >> "$GITHUB_ENV"
          echo "### $(tools/version.sh --long)" >> "$GITHUB_STEP_SUMMARY"

      # A tag that disagrees with the tree is a release that lies about its own
      # contents, which is worse than no release.
      - name: Check the tag against the tree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want=$(tools/version.sh --tag)
          got=${GITHUB_REF#refs/tags/}
          if [ "$want" != "$got" ]; then
              echo "::error::tag $got does not match the tree, which says $want."
              echo "Bump project(AmiNetXDuo VERSION ...) in CMakeLists.txt, or retag."
              exit 1
          fi
          echo "tag $got matches the tree"

      - name: Toolchain pin
        id: pin
        run: echo "sha=$(tools/fetch-toolchain.sh --print-sha)" >> "$GITHUB_OUTPUT"

      # The key carries a hash of the crt0 repair as well as the toolchain
      # pin: the cached tree is a REPAIRED tree, so it is only reusable by a
      # build whose repair is the same one. Bumping a hand-written suffix was
      # the first attempt and it went stale immediately -- a cache saved by
      # the 4-file version of the script was restored by the 11-file version,
      # which correctly refused to build on it.
      - name: Cache the pinned m68k toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/aminetxduo/toolchain
          key: m68k-amigaos-gcc-15.2.0-${{ steps.pin.outputs.sha }}-${{ hashFiles('tools/fix-toolchain-crt0.py', 'tools/fix-toolchain-inline-const.py') }}

      - name: Fetch the toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: tools/fetch-toolchain.sh

      # A cache restored from before the crt0 repair existed contains the
      # BROKEN crt0, and the fetch above does not run on a hit -- so this is
      # not belt-and-braces, it is the only thing standing between a warm
      # cache and shipping commands that crash on return to the Shell. The
      # key is versioned too, so an old cache is not reused in the first
      # place; this catches the case where it is restored anyway.
      - name: The toolchain's crt0 is repaired
        run: tools/fetch-toolchain.sh --check-crt0

      # Same reasoning for the NDK inlines: a warm cache from before the
      # repair builds a Write() that reads its buffer pointer out of a
      # register nobody wrote, and nothing else notices.
      - name: The toolchain's inline register ABI is repaired
        run: tools/fetch-toolchain.sh --check-inlines

      - name: Report the toolchain
        run: |
          . tools/amiga-toolchain.sh
          echo "AMIGA_TOOLCHAIN_ROOT=$AMIGA_TOOLCHAIN_ROOT" >> "$GITHUB_ENV"
          "$AMIGA_GCC" --version | head -1

      # host32 needs -m32, which on the runner means gcc-multilib.  Without it
      # tools/ci.sh's host32 stage skips itself, so the two drivers below go
      # unrun and the stage still reports green.
      - name: 32-bit host libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib

      # Tier 1 in full before packaging anything.  A release that was never
      # built clean is not a release, and this is the same script a developer
      # runs locally.
      #
      # host32 was not in this list and is in ci.yml's, so "tier 1 in full" was
      # not what a release got: fuzz_mdns and fuzz_tls_crypto were the two
      # stages a release skipped.  Both read bytes chosen by somebody else --
      # unauthenticated multicast, and a TLS server's handshake before any key
      # exists to check it against -- and both need sizeof(void*) == 4, which
      # is why they are a separate build and why they are easy to leave out.
      # THE OPTION ARMS ARE A SEPARATE JOB, in parallel, because twelve cross
      # builds at ~82 s each on a hosted runner is fifteen minutes of a
      # twenty-two minute release and the ceiling is ten.  They validate; they
      # build nothing this job packs -- the archive comes from build/release
      # and build/release-minimal below, configured here.  `default` stays:
      # the conformance stage needs build/ci/default to exist.
      - name: tools/ci.sh
        run: >-
          AMINETXDUO_ANALYZE=1 AMINETXDUO_CI_CROSS="default"
          tools/ci.sh host host32 cross web analyze conformance

      # TLS is on by default, and the archive ships tls.library and the trust
      # store.  make-dist.sh refuses to pack a missing or host-scavenged store,
      # so a release cannot silently ship one that trusts nothing.
      #
      # TWO BUILDS, because the archive carries two libraries: the one every
      # 68k runs, and `minimal` for a measured 1 MB machine.  It was four, one
      # per CPU, and the CPU is gone from the archive entirely -- each library,
      # device and command is built -m68000 and picks its own inner loops from
      # AttnFlags at init.  The directory names are what make-dist.sh derives
      # from -b, so they are not free-form.
      - name: Build the shipping configuration
        run: |
          cmake -S . -B build/release \
                -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-m68k-amigaos.cmake \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build build/release --parallel

          # The second drawer: everything optional compiled out, for somebody
          # who has measured their machine and wants the memory back.
          #
          # SEVEN OPTIONS, not five.  This step used to give five and ci.sh's
          # minimal arm gave seven, so the drawer that shipped carried the
          # ARexx host and the TCP: handler and the arm that compiled it under
          # fatal warnings did not -- and emulator.yml's end-to-end installed
          # the seven-option one, so what was tested on a real Workbench was
          # not what shipped either.  Measured: the two are 12,248 bytes,
          # which on the 1 MB machine this drawer exists for is the point.
          cmake -S . -B build/release-minimal \
                -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-m68k-amigaos.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                -DAMINETXDUO_IPV6=OFF -DAMINETXDUO_MDNS=OFF \
                -DAMINETXDUO_BPF=OFF -DAMINETXDUO_TLS=OFF \
                -DAMINETXDUO_MULTICAST=OFF \
                -DAMINETXDUO_AREXX=OFF -DAMINETXDUO_TCPDEVICE=OFF
          cmake --build build/release-minimal --parallel

      # ssh comes from clients/, not the CMake tree, so a `cmake --build` does
      # not produce it and make-dist.sh would quietly ship an archive without
      # it. Built here so a release always carries it; dbclient defaults to the
      # 25519 rewritten for this machine.
      # ONCE.  It used to be three times, one per processor drawer, because a
      # 68020 binary takes an illegal instruction on a 68000 and the 68060
      # dropped instructions the 68020 build uses.  AMINETXDUO_CLIENT_ANY=1
      # builds one that carries both X25519 field multiplies and picks at the
      # first handshake (clients/dropbear/amiga_25519.c).
      - name: Build the ported clients
        run: |
          AMINETXDUO_CLIENT_ANY=1 AMIGA_CLIENT_ARCH=-m68000 \
              clients/dropbear/build.sh -b build/ssh

      # An archiver that can CREATE.  Lhasa, which is what "lha" usually is on
      # a Linux box, only extracts, and make-dist.sh then falls back to
      # dist/lhapack.py, which writes a valid archive with nothing compressed
      # in it.  Every release up to and including 0.17.0 shipped that way: 86
      # files at a 100.0% ratio, 3.3 MB that should be about half of it.
      # jlha is already one of the three make-dist.sh probes for.
      - name: An archiver that can create
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jlha-utils

      # AMINETXDUO_SSH names exactly what the step above built, so the packed
      # binary cannot be a stale tree.
      - name: Build the distribution archive
        env:
          AMINETXDUO_SSH: build/ssh/dbclient
        run: dist/make-dist.sh -b build/release

      # A release that silently lost ssh or the bundled Installer would look
      # fine -- until someone tried to install with nothing to run the script.
      # The manual is here for the same reason and a worse history: it was
      # missing from every archive for a month, because make-dist.sh globbed
      # the wrong directory and said so in a note nobody read.
      - name: ssh, the Installer and the manual really are in the archive
        run: |
          # ssh is in this list because a per-CPU one was not, once, and its
          # absence is silent at every step: make-dist.sh skips a binary that is
          # not executable rather than failing, and the installer copies it only
          # `(if (exists ...))`, so a machine could install with no C:ssh and no
          # message.  There is one name now and this is where it is checked.
          for f in C/ssh Installer \
                   Docs/AmiNetXDuo.guide Docs/AmiNetXDuo.guide.info; do
              [ -f "build/dist/AmiNetXDuo/$f" ] || {
                  echo "::error::$f is missing from the archive"; exit 1; }
          done
          ls -l build/dist/AmiNetXDuo/C/ssh build/dist/AmiNetXDuo/Installer
          ls -l build/dist/AmiNetXDuo/Docs/

      # The two libraries the archive carries.  There used to be four, one per
      # CPU, and a release that lost one looked fine right up until somebody
      # with that machine ran the installer and it aborted.  Now there is
      # nothing to resolve: Libs/ is what every machine gets and Libs/minimal/
      # is what somebody asks for.
      - name: Both libraries really are in the archive
        run: |
          for f in Libs/bsdsocket.library Libs/tls.library \
                   Libs/minimal/bsdsocket.library; do
              [ -f "build/dist/AmiNetXDuo/$f" ] || {
                  echo "::error::$f is missing"; exit 1; }
          done
          # minimal is built with -DAMINETXDUO_TLS=OFF, so it must NOT have one.
          [ ! -e "build/dist/AmiNetXDuo/Libs/minimal/tls.library" ] || {
              echo "::error::Libs/minimal has a tls.library; that build has TLS off"
              exit 1; }
          ls -lR build/dist/AmiNetXDuo/Libs/

      - name: Describe what is in it
        run: |
          {
            echo "### $(tools/version.sh --long)"
            echo
            echo '```'
            ls -l build/dist/*.lha
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Always uploaded, tag or not, so workflow_dispatch exercises packaging
      # without publishing.
      - name: Upload the archive as a workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: AmiNetXDuo-${{ env.AMINETXDUO_VERSION_COMPOUND }}
          path: build/dist/*.lha
          if-no-files-found: error
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(mktemp)
          {
            echo "$(tools/version.sh --long)"
            echo
            echo "Drop \`AmiNetXDuo-$(tools/version.sh --product).lha\` on a Workbench"
            echo "window and run \`Install-AmiNetXDuo\`."
            echo

            # This release's section of CHANGELOG.md, plus every earlier
            # section of the same minor -- somebody arriving at 0.14.2 wants
            # what 0.14.1 and 0.14.0 changed too, not just the last patch.
            # Its own heading is dropped (the version is already the title);
            # the earlier ones are kept so the groups stay legible.  A missing
            # section is a release that would ship with no summary, so it fails
            # rather than publishes.
            ver=$(tools/version.sh --product)
            awk -v v="## $ver" -v pfx="## ${ver%.*}." '
                $0 == v {found = 1; next}
                found && /^## / && index($0, pfx) != 1 {exit}
                found {print}
            ' CHANGELOG.md > "$notes.body"
            [ -s "$notes.body" ] || {
                echo "::error::CHANGELOG.md has no '## $ver' section"; exit 1; }
            cat "$notes.body"
          } > "$notes"

          gh release create "${GITHUB_REF#refs/tags/}" \
             --title "$(tools/version.sh --long)" \
             --notes-file "$notes" \
             build/dist/*.lha
